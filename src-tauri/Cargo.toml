[package]
name = "claude-fleet"
version = "0.2.39"
description = "Desktop app for managing Claude Code sessions across hosts"
authors = ["martin-janci"]
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "claude_fleet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Web Inspector in *release* builds. Debug builds always have devtools: tauri
# gates them on `any(debug_assertions, feature = "devtools")`, so `pnpm tauri
# dev` is unaffected. Opt in for a release build with
# `cargo tauri build --features devtools`. (Cargo does not support
# `[target.'cfg(debug_assertions)'.dependencies]`, hence a feature.)
devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fleet-core = { path = "../crates/fleet-core" }
# Directly, not through `fleet-core`: the loopback rule, the hub-URL parser
# and the reconnect curve this app shares with `fleet-agent` and `fleet-hub`.
# Already in the tree — `fleet-core` depends on it.
fleet-proto = { path = "../crates/fleet-proto" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
sysinfo = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
portable-pty = "0.9"
libc = "0.2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
# Already in the lockfile via tauri; used to validate `hub.remote_url`.
url = "2"
# Object-safe async trait for the hub transport seam (already in the tree
# via fleet-core).
async-trait = "0.1"
# Already in the lockfile via fleet-core (the agent transport) and used again
# here for the attachment thumbnail data URL.
base64 = "0.22"

# The macOS keychain, so the client token never touches a child process's
# argv (which EDR/EndpointSecurity capture and retain). macOS-only: Linux's
# and Windows' dependency sets are untouched, which is what separates this
# from the cross-platform `keyring` crate that was rejected at Task 1.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
tempfile = "3"
# `test-util` only: `#[tokio::test(start_paused = true)]`, so the event
# bridge's idle-timeout tests run on a clock that jumps rather than waiting
# out a real 37-second silence. fleet-core enables it the same way.
tokio = { version = "1", features = ["full", "test-util"] }
