[package]
name = "claude-fleet"
version = "0.2.18"
description = "Desktop app for managing Claude Code sessions across hosts"
authors = ["martin-janci"]
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "claude_fleet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Web Inspector in *release* builds. Debug builds always have devtools: tauri
# gates them on `any(debug_assertions, feature = "devtools")`, so `pnpm tauri
# dev` is unaffected. Opt in for a release build with
# `cargo tauri build --features devtools`. (Cargo does not support
# `[target.'cfg(debug_assertions)'.dependencies]`, hence a feature.)
devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fleet-core = { path = "../crates/fleet-core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
sysinfo = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
portable-pty = "0.9"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
