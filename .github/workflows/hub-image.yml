name: hub-image
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  meta:
    runs-on: ubuntu-24.04
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/fleet-hub
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha

  # One native leg per platform — no QEMU. A Rust release build the size of
  # fleet-hub's under QEMU emulation commonly takes 30-60+ minutes; a native
  # arm64 GitHub-hosted runner (GA and free for public repos since 2025 —
  # this repo is public, confirmed with `gh repo view`) instead builds arm64
  # at roughly the amd64 leg's own wall-clock cost, and the two legs run in
  # parallel, so adding arm64 does not slow amd64's publication at all — the
  # amd64 leg's own steps are unchanged from before this file added arm64.
  # `timeout-minutes` below is ordinary CI hygiene for a new job, not a sign
  # either leg is expected to need it.
  #
  # Each leg pushes its own image BY DIGEST (push-by-digest, no tag) instead
  # of a tag directly: two legs finishing at different times must never race
  # to push the SAME tag with two different single-arch manifests, each
  # overwriting the other. `merge` below waits for both digests and combines
  # them into one multi-arch manifest under the real tags — the standard
  # docker/build-push-action pattern for a multi-platform image built across
  # more than one runner.
  build:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            os: ubuntu-24.04
          - platform: linux/arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/fleet-hub/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ needs.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/fleet-hub,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      # No ${{ }} expression carrying ref/tag text is interpolated inside a
      # `run:` body anywhere in this job: the digest is the build step's own
      # output, passed through `env:` like everything else that varies.
      - name: Export the digest for the merge job
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.os }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [meta, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Create the multi-arch manifest and push it under the real tags
        working-directory: /tmp/digests
        env:
          TAGS: ${{ needs.meta.outputs.tags }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/fleet-hub
        run: |
          set -euo pipefail
          tag_args=()
          while IFS= read -r t; do
            [ -n "$t" ] && tag_args+=(-t "$t")
          done <<<"$TAGS"
          digest_args=()
          for f in *; do
            digest_args+=("$IMAGE@sha256:$f")
          done
          docker buildx imagetools create "${tag_args[@]}" "${digest_args[@]}"
      - name: Inspect the pushed manifest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/fleet-hub
          VERSION: ${{ needs.meta.outputs.version }}
        run: docker buildx imagetools inspect "$IMAGE:$VERSION"
