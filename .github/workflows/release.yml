name: release

# Builds the desktop bundles, attaches them to a GitHub Release, and PUBLISHES
# it once the release is proven complete.
#
# Trigger: pushing the `vX.Y.Z` tag that `scripts/release.sh` creates
# (`git push origin main --follow-tags`). `workflow_dispatch` is a manual
# re-run: pick the tag under "Use workflow from". Both jobs are gated on
# `github.ref_type == 'tag'`, so dispatching from a branch is a no-op rather
# than creating a release named after the branch.
#
# WHY THE RELEASE PUBLISHES ITSELF. The release used to be created as a draft
# and published by hand. That gate cost nothing when it was pressed and
# everything when it was not: six complete, checksummed, green-run releases
# (v0.2.28 through v0.2.37) sat unpublished — versions users could not
# download, for no reason anyone recorded. The keypress was never a decision;
# `verify-release` already makes the judgement it was standing in for, and
# makes it better, by enumerating the release's real assets. So the release is
# created as a draft, built into, verified, and then published by the `publish`
# job — which runs on the DEFAULT "every need succeeded" condition, so a failed
# leg leaves the draft unpublished and intact for inspection. "Draft only when
# something went wrong" falls out of that, with no second rule to keep in sync.
#
# Publishing fires docs.yml (`release: published`).
#
# `version-consistency` is the gate in front of all of it: every other job
# `needs:` it, it is NOT `continue-on-error`, and it asserts both that the six
# version carriers agree and that this tag is `v<that version>`. A tag whose
# name disagrees with src-tauri/tauri.conf.json — the file the bundle filenames
# come from — therefore fails before tauri-action runs a single build, instead
# of producing a release that advertises three different versions (F-C5, F-C6).
#
# `create-release` creates the draft exactly once (or reuses an existing
# draft for the same tag on a re-run) and passes its id to the three build
# legs, so concurrent legs never race to create duplicate drafts.
#
# WHAT THIS RUN IS ALLOWED TO BE GREEN WITH — the continue-on-error split.
# Two different things are being protected and they pull in opposite
# directions, so they are separated deliberately:
#
#   * per-LEG isolation (kept, unchanged): `fail-fast: false` on both
#     matrices, and `continue-on-error: true` on `agent-hub-binaries` and
#     `checksums`. One arch failing must never cancel another arch, delay the
#     desktop bundles, or block the draft.
#   * per-RELEASE completeness (new): `verify-release`, the final job, is NOT
#     `continue-on-error`. It enumerates the release's ACTUAL assets by id and
#     fails the run unless the complete expected set is present and every
#     asset has a SHA256SUMS line.
#
# So a leg may still fail without dragging the others down — and the run
# still goes red, at the end, in one place, naming exactly which assets are
# missing. Before this job existed, six releases shipped an unversioned
# `.app.tar.gz` and a SHA256SUMS covering 4 of 11 assets, on green runs.
#
# `plan` is where the shape of the release is decided: it runs
# `scripts/release-assets.sh`, the single asset manifest, and emits both
# build matrices from it. That same manifest names the assets
# `package-linux-release.sh` must produce, the name
# `rename-updater-asset.sh` renames tauri-action's output to, and the set
# `verify-release.sh` requires — one table, with no second list to drift.
#
# CODE SIGNING IS INTENTIONALLY ABSENT. There is no Apple Developer ID
# (and no Windows certificate) for this project yet, so nothing here is
# signed or notarized. Consequences:
#   - macOS Gatekeeper refuses the .app/.dmg on first launch, reporting it as
#     "damaged". Users must clear the quarantine flag after copying it to
#     /Applications (right-click -> Open does not reliably work for an
#     unsigned app):
#       xattr -dr com.apple.quarantine /Applications/claude-fleet.app
#     The user-facing instructions live in the README.
#   - The Linux AppImage/.deb are unsigned; that is normal for those formats.
# When a Developer ID exists, add APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD
# / APPLE_SIGNING_IDENTITY / APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID secrets
# and pass them through `env:` on the tauri-action step (see
# https://v2.tauri.app/distribute/sign/macos/). Do not add ad-hoc signing
# here; it would give users a false sense of provenance.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# One release run per tag at a time; a second push of the same tag queues
# behind the first instead of racing it for the draft's assets.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # Gate. Same script as ci.yml's version-consistency job, plus --expect-tag:
  # the six carriers and the four Cargo.lock entries must agree, fleet-core
  # must still be the allowlisted, unpublishable 0.1.0, and this tag must be
  # "v<package.json version>". Deliberately NOT continue-on-error, and every
  # job below `needs:` it, so nothing is built, no draft is created and no
  # asset is uploaded for a tag that disagrees with the tree it points at.
  # The tag name arrives through env:, never interpolated into a run: body.
  version-consistency:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Assert the carriers and the tag agree
        env:
          REF_NAME: ${{ github.ref_name }}
        run: scripts/check-version-consistency.sh --expect-tag "$REF_NAME"

  # The one place that decides what this release consists of. Both build
  # matrices below are generated here from scripts/release-assets.sh rather
  # than written out in YAML, so the list of legs and the list of expected
  # asset names cannot disagree: they are the same table. Adding a target is
  # a one-line edit to that script.
  plan:
    if: github.ref_type == 'tag'
    needs: version-consistency
    runs-on: ubuntu-24.04
    outputs:
      desktop: ${{ steps.matrices.outputs.desktop }}
      bins: ${{ steps.matrices.outputs.bins }}
    steps:
      - uses: actions/checkout@v4
      - name: Derive the build matrices from the release asset manifest
        id: matrices
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          {
            echo "desktop=$(scripts/release-assets.sh matrix desktop)"
            echo "bins=$(scripts/release-assets.sh matrix bins)"
          } >>"$GITHUB_OUTPUT"
          echo "Assets this release must end up with:"
          scripts/release-assets.sh assets "${REF_NAME#v}"

  create-release:
    if: github.ref_type == 'tag'
    needs: version-consistency
    runs-on: ubuntu-24.04
    outputs:
      release_id: ${{ steps.release.outputs.result }}
    steps:
      # Needed only for CHANGELOG.md: this job was pure github-script before
      # the notes moved onto the release.
      - uses: actions/checkout@v4
      # The release notes are the CHANGELOG section for this version,
      # verbatim — the text that was written and reviewed in the release
      # commit, rather than a second copy composed here. No section means no
      # notes, and this step fails the release rather than publishing an empty
      # one; `scripts/release.sh` always writes one, so this fires only for a
      # tag that was not cut by it.
      - name: Take this version's notes out of CHANGELOG.md
        env:
          REF_NAME: ${{ github.ref_name }}
        run: scripts/changelog-section.sh "${REF_NAME#v}" >notes.md
      - name: Create (or reuse) the release for this tag
        id: release
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const fs = require('fs');
            const tag = context.ref.replace(/^refs\/tags\//, '');
            const { owner, repo } = context.repo;
            // getReleaseByTag() does not return drafts, so scan the list.
            // Matching on the tag ALONE, not on `r.draft`: since this workflow
            // publishes what it builds, a re-run of a tag that already
            // succeeded finds a PUBLISHED release, and a draft-only search
            // would fall through to createRelease() and 422 with
            // "already_exists" — breaking the re-run recovery path that
            // docs/RELEASING.md tells you to use when a leg fails.
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            const existing = releases.find(r => r.tag_name === tag);
            if (existing) {
              // The body is deliberately left alone on reuse: the tag pins
              // the commit, so the build sha recorded below is still the
              // right one, and a re-run must not clobber notes the owner has
              // already edited into the release.
              core.info(`Reusing existing release ${existing.id} for ${tag} (draft: ${existing.draft})`);
              return existing.id;
            }
            const body = [
              fs.readFileSync('notes.md', 'utf8').trim(),
              '',
              '---',
              '',
              'Unsigned builds (no Apple Developer ID yet). On macOS the first launch reports the app as *"damaged and can\'t be opened"* — it is not damaged. Drag it to `/Applications`, then clear the quarantine flag:',
              '',
              '```bash',
              'xattr -dr com.apple.quarantine /Applications/claude-fleet.app',
              '```',
              '',
              `Right-click → **Open** does not help here: that is the bypass for a signed-but-unnotarized app. Full instructions: [Installing a release build](https://github.com/${owner}/${repo}/blob/${tag}/README.md#installing-a-release-build).`,
              '',
              `Every version's notes: [CHANGELOG.md](https://github.com/${owner}/${repo}/blob/${tag}/CHANGELOG.md).`,
              '',
              // Built and signed in its own repository, under this same tag,
              // by scripts/release-mobile.sh (docs/RELEASING.md step 6).
              `Android app: the signed APK is on [fleet-mobile ${tag}](https://github.com/${owner}/fleet-mobile/releases/tag/${tag}).`,
              '',
              `Verify a download against the \`SHA256SUMS\` asset attached below — it covers **every** asset on this release:`,
              '',
              '```bash',
              `curl -LO https://github.com/${owner}/${repo}/releases/download/${tag}/SHA256SUMS`,
              'sha256sum -c SHA256SUMS --ignore-missing',
              '```',
              '',
              // The commit, not just the tag: a tag can be deleted and
              // re-cut at a different commit, and nothing else on the
              // release records which tree these bundles came from. The
              // fleet-agent/fleet-hub tarballs carry the same sha in their
              // README.txt (scripts/package-linux-release.sh).
              `Built from commit \`${context.sha}\` (https://github.com/${owner}/${repo}/commit/${context.sha}).`,
            ].join('\n');
            // Created as a draft even though it will be published: the
            // assets are uploaded one at a time over the next twenty minutes,
            // and a release that is visible while half-built is worse than
            // one that appears complete. The `publish` job flips it.
            const { data } = await github.rest.repos.createRelease({
              owner, repo,
              tag_name: tag,
              name: `claude-fleet ${tag}`,
              body,
              draft: true,
              prerelease: false,
            });
            core.info(`Created draft release ${data.id} for ${tag}`);
            return data.id;

  build:
    if: github.ref_type == 'tag'
    # version-consistency named explicitly, not just inherited through
    # create-release: this leg's bundle filenames come from tauri.conf.json, so
    # the tag-vs-carrier assertion is a direct precondition of it.
    needs: [version-consistency, create-release, plan]
    name: bundle (${{ matrix.leg }})
    strategy:
      fail-fast: false
      # Generated by the `plan` job from scripts/release-assets.sh — the same
      # table that names the assets verify-release requires. Do not inline a
      # second copy of it here.
      matrix: ${{ fromJSON(needs.plan.outputs.desktop) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Same package list as ci.yml; keep them in sync.
      - name: Install Tauri Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev pkg-config
      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - uses: dtolnay/rust-toolchain@stable
      - name: Add cross-compile target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: ${{ matrix.os }}-${{ matrix.target || 'native' }}
      - run: pnpm install --frozen-lockfile
      # tauri-action runs `beforeBuildCommand` (pnpm build) from
      # src-tauri/tauri.conf.json, then `cargo tauri build`, and uploads the
      # bundles to the draft created by the create-release job. All matrix
      # legs attach to that same draft.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
      # tauri-action names the macOS updater bundle `claude-fleet_<arch>
      # .app.tar.gz` — the one asset on the release with no version in its
      # filename, which is why v0.2.21/.23/.26/.32/.33/.34 all published
      # byte-different files under two identical names. The bundler
      # hard-codes that name, so it is fixed after the fact, by renaming the
      # uploaded asset through the releases API (the action's own build and
      # upload are untouched). Data-driven and safe on every leg: the script
      # exits 0 for a leg whose manifest entry declares no `.app.tar.gz`,
      # which is how the Linux leg passes through it.
      - name: Give the macOS updater bundle its version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          TAG: ${{ github.ref_name }}
          LEG: ${{ matrix.leg }}
        run: scripts/rename-updater-asset.sh

  # fleet-agent and a bare fleet-hub, packaged for a Linux host with no
  # Tauri toolchain and no `cargo` of its own. Independent of `build` above —
  # both legs only `needs: create-release`, never each other — so a failure
  # here can never block or delay the desktop bundles, and `continue-on-error`
  # keeps a failed leg from turning the whole workflow run red (the desktop
  # legs' own status stays the signal to watch). It also cannot touch the
  # release itself beyond uploading its own assets: it never deletes or
  # un-drafts anything.
  #
  # Runner/target choice: native `ubuntu-22.04` / `ubuntu-22.04-arm` GitHub-
  # hosted runners for both legs (arm64 hosted runners are GA and free for
  # public repos as of 2025; this repo is public) — no `cross`, no QEMU,
  # nothing to emulate. `-22.04` rather than `-24.04` on purpose: these
  # binaries carry no Tauri/GTK dependency (see ci.yml's `hub-headless` job),
  # so nothing needs 24.04's newer packages, and building on 22.04's older
  # glibc (2.35) means the binaries also run on Debian 12 and Ubuntu 22.04
  # hosts, not only 24.04+ — a 24.04 build would refuse to start there
  # (glibc >= 2.39 required). gnu targets, not musl: neither crate has been
  # verified to build against musl libc, and glibc's compatibility floor
  # above already covers the hosts this ships to (see docs/hub.md).
  agent-hub-binaries:
    if: github.ref_type == 'tag'
    # `continue-on-error` below keeps a failure here off the run's overall
    # status; it does NOT weaken the gate — a failed `needs` skips this job
    # outright, so the tarballs (named from ${TAG#v}) are never built for a
    # tag the gate rejected.
    needs: [version-consistency, create-release, plan]
    continue-on-error: true
    name: agent/hub binaries (${{ matrix.target }})
    strategy:
      fail-fast: false
      # Same single source as the desktop matrix above: the runner labels and
      # target triples here come from scripts/release-assets.sh, which also
      # declares the four tarball names this leg must write (asserted by
      # scripts/package-linux-release.sh) and that verify-release requires.
      matrix: ${{ fromJSON(needs.plan.outputs.bins) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: agent-hub-binaries-${{ matrix.target }}
      # Both crates build with no Tauri system libraries and no fleet-core
      # (see ci.yml's hub-headless job) — nothing to install first.
      - run: cargo build -p fleet-agent -p fleet-hub --release --locked --target ${{ matrix.target }}
      # A checked-in script rather than an inline heredoc: no ${{ }}
      # expression carrying tag/ref text is interpolated inside a `run:`
      # body — tag, target and repository all arrive through `env:` instead,
      # so a tag name can never be interpreted as shell — and it is
      # independently dry-runnable (see the task report). This leg writes
      # only its OWN checksums, to `dist/SHA256SUMS.<target>` — never a
      # plain `dist/SHA256SUMS` two legs would both produce and race to
      # upload (whichever finishes last would silently overwrite the
      # other's, covering 2 of 4 tarballs). the `checksums` job below
      # combines both legs' files into the one SHA256SUMS the release gets.
      - name: Package the tarballs and this leg's checksums
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          # Recorded in each tarball's README.txt. The tag alone cannot
          # identify a build (a tag can be moved); the commit can.
          GIT_SHA: ${{ github.sha }}
        run: scripts/package-linux-release.sh
      # Uploaded BY NUMERIC RELEASE ID, not by tag: see
      # scripts/upload-release-asset.sh for why (a draft is not resolvable
      # by tag through the REST "get release by tag" endpoint — the same
      # reason `build` above hands tauri-action `releaseId:` instead of a
      # tag). contents:write is already granted at the workflow level.
      - name: Upload the tarballs to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          set -euo pipefail
          for f in dist/*.tar.gz; do
            scripts/upload-release-asset.sh "$f"
          done
      # This leg's own checksums travel to the `checksums` job as a workflow
      # artifact, distinctly named per target so two legs' files never
      # collide. They are no longer the *source* of SHA256SUMS (that is the
      # release itself) — they are the cross-check that the bytes GitHub
      # serves are the bytes this runner built.
      - uses: actions/upload-artifact@v4
        with:
          name: sha256sums-${{ matrix.target }}
          path: dist/SHA256SUMS.${{ matrix.target }}
          if-no-files-found: error
          retention-days: 1

  # Publishes the one `SHA256SUMS` asset, covering EVERY asset on the release
  # — desktop bundles included. It therefore `needs: build` as well as
  # `agent-hub-binaries`: it can only checksum what has already been
  # uploaded. The assets are enumerated and downloaded from the release by id
  # (scripts/download-release-assets.sh), hashed
  # (scripts/merge-sha256sums.sh), and the per-target files the build legs
  # produced are used to assert that what GitHub serves matches what was
  # built.
  #
  # Runs even if a leg failed (`if: !cancelled()`, plus `continue-on-error:
  # true` like the matrices it depends on) so it still publishes a correct
  # PARTIAL SHA256SUMS for whatever the release does carry. Deciding that a
  # partial release is unacceptable is NOT this job's business — that is
  # `verify-release` below, which is the one job here without
  # `continue-on-error`.
  #
  # `!cancelled()` overrides the default "all needs succeeded" condition, so
  # the gate has to be re-stated here by hand: without the explicit
  # `needs['version-consistency'].result == 'success'` this job would still run
  # after the gate failed (it deliberately tolerates a failed build leg,
  # which is a different thing).
  checksums:
    if: github.ref_type == 'tag' && !cancelled() && needs['version-consistency'].result == 'success'
    needs: [version-consistency, create-release, build, agent-hub-binaries]
    continue-on-error: true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: sums
          pattern: sha256sums-*
          merge-multiple: true
        continue-on-error: true
      - name: Download every asset currently on the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: scripts/download-release-assets.sh assets
      # An empty SHA256SUMS.tmp means the release has no assets at all (every
      # leg failed before uploading) — nothing to publish, not a failure of
      # this job. A build-vs-release digest disagreement, or a per-target file
      # naming something the release does not carry, exits 1 and fails this
      # step for real, via `set -e`.
      - name: Checksum them
        id: merge
        run: |
          set -euo pipefail
          scripts/merge-sha256sums.sh assets sums >SHA256SUMS.tmp
          if [ -s SHA256SUMS.tmp ]; then
            mv SHA256SUMS.tmp SHA256SUMS
            echo "wrote=1" >>"$GITHUB_OUTPUT"
          else
            rm -f SHA256SUMS.tmp
            echo "wrote=0" >>"$GITHUB_OUTPUT"
          fi
      - name: Upload SHA256SUMS
        if: steps.merge.outputs.wrote == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: scripts/upload-release-asset.sh SHA256SUMS

  # THE GATE ON THE RELEASE AS A WHOLE — deliberately the only job here with
  # no `continue-on-error`. Per-leg isolation above means a failed leg does
  # not turn the run red by itself; this job makes sure an *incomplete
  # release* does. It enumerates the release's actual assets by id and fails
  # unless every asset scripts/release-assets.sh declares for this version is
  # present, nothing unexpected is attached, and SHA256SUMS has a line for
  # each one. See scripts/verify-release.sh.
  #
  # `!cancelled()` for the same reason as `checksums`: this job must run
  # precisely when an upstream leg failed, which is when the default
  # needs-succeeded condition would skip it — and a skipped gate is not a
  # gate. The version-consistency result is therefore re-stated by hand.
  verify-release:
    if: github.ref_type == 'tag' && !cancelled() && needs['version-consistency'].result == 'success'
    needs: [version-consistency, create-release, build, agent-hub-binaries, checksums]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Assert the release is complete and fully checksummed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          TAG: ${{ github.ref_name }}
        run: scripts/verify-release.sh

  # THE PUBLICATION. Everything above builds into a draft; this is what makes
  # it a release people can download.
  #
  # `if:` names only the tag gate, so the DEFAULT "all needs succeeded"
  # condition applies — the exact opposite of the `!cancelled()` on `checksums`
  # and `verify-release`, and the reason those two are written the way they
  # are. A failed leg, a failed gate, a cancelled run: any of them skips this
  # job and the draft stays a draft, complete with whatever it did manage to
  # build, for someone to look at. There is no "publish anyway" path and no
  # second definition of "good enough" here: `verify-release` succeeding IS
  # the definition.
  #
  # Idempotent, because the re-run path leads straight back through it: it
  # PATCHes draft/prerelease/make_latest to what they should be, whatever they
  # are now — including on a release that a human published by hand, or one
  # created before this job existed.
  publish:
    if: github.ref_type == 'tag'
    needs: [create-release, verify-release]
    runs-on: ubuntu-24.04
    steps:
      - name: Publish the release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const release_id = Number(process.env.RELEASE_ID);
            if (!Number.isInteger(release_id)) {
              core.setFailed(`create-release produced no usable release id (got '${process.env.RELEASE_ID}')`);
              return;
            }
            const tag = context.ref.replace(/^refs\/tags\//, '');
            const { owner, repo } = context.repo;
            // A pre-release is decided by the tag and nothing else: `v0.3.0`
            // is a release, `v0.3.0-rc.1` is a release candidate. Same rule
            // scripts/release.sh, scripts/release-assets.sh and
            // hub-image.yml's `latest` guard use.
            const prerelease = tag.slice(1).includes('-');
            // make_latest, stated rather than inherited. 'legacy' is
            // GitHub's own by-creation-date rule, which is right here: it
            // keeps the newest release the "Latest" one, and stops the
            // publication of an old, backfilled draft from dragging the
            // Latest badge backwards. A release candidate never takes it.
            const make_latest = prerelease ? 'false' : 'legacy';
            const { data } = await github.rest.repos.updateRelease({
              owner, repo, release_id,
              draft: false,
              prerelease,
              make_latest,
            });
            core.info(`Published ${tag}: ${data.html_url} (prerelease: ${prerelease}, make_latest: ${make_latest})`);
            await core.summary
              .addHeading(`Published ${tag}`, 3)
              .addLink(data.html_url, data.html_url)
              .write();
