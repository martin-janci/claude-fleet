name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `labeled` so adding `ci:all-os` to a PR starts the macOS/Windows legs
    # (see "MACOS AND WINDOWS ON MAIN" below).
    types: [opened, synchronize, reopened, labeled]
  # Manual re-run. The real coverage is the two triggers above — every PR and
  # every push to main — but without this the workflow cannot be started from
  # the UI or `gh workflow run ci.yml` at all, which is how a job added here
  # gets exercised once against main before anyone relies on it.
  workflow_dispatch:

# ONE LIVE RUN PER REF. Every push to main and every PR push used to start a
# complete run — ten jobs, the macOS, Windows and hub legs among them, around
# 17-19 minutes each warm — and nothing ever cancelled the run a newer commit
# had already superseded. On 2026-10-03 three PRs merged inside 90 seconds, so
# four full runs were alive at once (#425's, plus main at 47787ac, 7dadde8 and
# db1a869) against a runner pool that cannot serve them. Jobs in the newest
# main run sat queued 1-3 minutes before `Set up job`, waiting on two runs
# whose verdict nobody would ever read, and a reviewer watching the PR saw
# spinners that did not move. That is the "CI is stuck" this block fixes.
#
# A PULL REQUEST cancels its own older run: once a new commit exists, the
# previous one's answer is about code that is gone, so it is pure waste.
# `github.ref` is `refs/pull/<n>/merge` here, so the group is per PR and two
# different PRs never cancel each other.
#
# A PUSH TO MAIN does NOT cancel — it queues. Each merge commit keeps its own
# recorded verdict (nothing else re-tests main between releases), and queueing
# is what actually frees the runners: the superseded runs finish one at a time
# instead of three abreast. workflow_dispatch is grouped with the ref it is
# dispatched at and likewise never cancels.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# THE OTHER HALF OF "STUCK" IS `timeout-minutes`, ON EVERY JOB BELOW. Not one
# job declared it, so all of them inherited GitHub's default of SIX HOURS: a
# job that deadlocks rather than fails holds its runner for the rest of the
# morning, and with the pool already full every other run queues behind it —
# the block above cannot help, because a cancelled run frees nothing while the
# hung job is the one still holding the slot. A hang is a real risk in this
# workspace and not a hypothetical one: the test suites are threaded and share
# a process-wide SQLite lock, and the e2e leg starts tmux sessions and daemons.
#
# Each ceiling is roughly 3x the warm, uncontended time measured on main
# (run 37101119677, 2026-10-03) — far enough above a slow cold-cache run to
# never fire on a healthy job, and low enough that a hang costs one job, not
# a morning:
#
#   job                  measured   ceiling
#   changes             (new: the docs-only filter)  5
#   version-consistency      0:10        15
#   ag                       0:16        15
#   frontend             2:06-4:39        30
#   rust                16:45-17:33       60
#   rust-windows            18:49         60
#   windows-bundle     (new: the bundle, split out of rust-windows)   60
#   clippy             (new: macOS/Windows lint, split out of the test jobs)   30
#   hub-headless            16:39         60
#   hub-image          (new: the hub Dockerfile, built before a tag)   30
#
# Raise one when the work in it legitimately grows; do not remove it.

# MACOS AND WINDOWS ON MAIN, NOT ON EVERY PULL REQUEST. A full run is fifteen
# jobs, eight of them on macOS or Windows runners, and the account's hosted
# pool runs at most five macOS jobs at a time, account-wide (fleet-mobile's
# CI draws from the same pool). On 2026-10-08 fifteen redesign PRs were open
# at once and each merge to main made every lane merge main back in, so each
# PR restarted its fifteen jobs every few minutes: `changes`, a 5-second job,
# waited 17 minutes for a runner, the macOS legs never got one before the
# next push cancelled them, and every PR sat on "Queued".
#
# So a pull request runs the Linux legs only (rust, frontend, ag, hub-headless,
# hub-image, version-consistency: seven jobs), and every push to main and
# every manual run still runs all three OSes, so a macOS or Windows break is
# caught on the merge commit that brought it. A PR that touches
# platform-specific code (cfg(target_os), the PTY, Windows paths, the bundle)
# gets the full matrix by adding the `ci:all-os` label. Skipped jobs count as
# passed for a required check; the matrix legs below simply do not exist on
# a Linux-only run.
#
# work::scale_tests' wall-clock budgets are enforced only with this set; a
# developer's loaded box prints an over-budget call instead of failing it.
env:
  FLEET_SCALE_BUDGETS: "1"

jobs:
  # SKIP THE BUILD WHEN A PR TOUCHES ONLY PROSE THAT NOTHING READS. A PR that
  # changed one plan or the build audit still ran every leg below: ten jobs,
  # 10-14 minutes, the Windows and macOS runners among them (#432 changed one
  # .md file). This job lists the PR's files; if every one is under a path
  # below, the build and test jobs are skipped (a skipped job counts as passed
  # for a required check) and only version-consistency runs.
  #
  # The list is deliberately an ALLOWLIST of prose no build or test reads, and
  # deliberately short. docs/*.md at the top of docs/ is NOT on it: tests read
  # control-api.md, hub.md, updates.md, work-graph.md, decisions.md,
  # settings-reference.md and the page schema/catalog there, so an edit to one
  # can fail CI. Before adding a path, grep crates/, src-tauri/, src/ and
  # scripts/ for it; a file a test reads must stay off this list.
  #
  # Pushes to main and manual runs always run everything, so each merge keeps
  # its own full verdict. If this job fails, its output is empty and every
  # gated job runs anyway (`!= 'false'` below): it fails open, never green.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          code=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              docs/superpowers/*|docs/plans/*|docs/specs/*|docs/adr/*|docs/ux/*|docs/images/*) ;;
              README.md|CLAUDE.md|RUST-BUILD-PERFORMANCE-AUDIT.md) ;;
              docs/architecture.md|docs/status.md) ;;
              *) echo "runs the build: $f"; code=true; break ;;
            esac
          done < <(git diff --name-only "$BASE...$HEAD")
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  # The six version carriers scripts/release.sh rewrites, plus the four
  # Cargo.lock member entries it syncs, must all hold the same string — and
  # crates/fleet-core must stay at its allowlisted 0.1.0 with `publish = false`.
  # Nothing used to check this, so the hand bump to 0.2.27 (fa8f3a30) went
  # unnoticed (F-C5). Seconds, not minutes: text reads plus the runner's
  # preinstalled node — no cargo build, no pnpm install, no cache.
  # release.yml runs the same script as its gating first job, there with
  # --expect-tag, so the pushed tag is checked too.
  version-consistency:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-version-consistency.sh
      # scripts/release-assets.sh is the single source for release.yml's two
      # build matrices, for the tarball names package-linux-release.sh must
      # produce, and for the asset set verify-release.sh demands. Nothing
      # else in CI runs it, so a typo there would first surface at tag time,
      # after the version gate has already passed. This is the cheapest
      # possible smoke test that it still parses, still emits legal matrix
      # JSON, and still declares assets for the version in package.json.
      - name: Smoke-test the release asset manifest
        run: |
          set -euo pipefail
          v="$(node -p 'require("./package.json").version')"
          scripts/release-assets.sh assets "$v"
          for kind in desktop bins; do
            scripts/release-assets.sh matrix "$kind" >"matrix-$kind.json"
            node -e 'const m=require("./"+process.argv[1]);if(!Array.isArray(m.include)||m.include.length===0)throw new Error("empty matrix: "+process.argv[1]);console.log(process.argv[1],"->",m.include.length,"leg(s)")' "matrix-$kind.json"
          done
          for leg in $(scripts/release-assets.sh legs); do
            scripts/release-assets.sh assets "$v" "$leg" >/dev/null
          done
      # A release's notes are CHANGELOG.md's section for its version, lifted
      # verbatim, and release.yml refuses to create a release without one.
      # Catching that at tag time would mean deleting a tag to fix it; catch
      # it on the PR instead. scripts/release.sh always writes the section, so
      # this can only fire on a version that was bumped by hand — which is
      # exactly the mistake that produced the untagged, changelog-less 0.2.27.
      - name: The current version has release notes
        run: |
          set -euo pipefail
          v="$(node -p 'require("./package.json").version')"
          scripts/changelog-section.sh "$v" >/dev/null
          echo "CHANGELOG.md has a section for $v"
      # deploy/hub/backup.sh and upgrade.sh against a fake docker and curl.
      # It ran only from ci-local.sh, so when upgrade.sh started passing
      # --env-file the fake stopped matching and 8 checks failed on main
      # with CI green. bash + sqlite3, a few seconds.
      - name: Hub deploy scripts
        run: |
          command -v sqlite3 >/dev/null || { sudo apt-get update -q && sudo apt-get install -yq sqlite3; }
          bash scripts/hub-deploy-scripts-test.sh
      # scripts/verify.sh's plan: which checks a set of changed files
      # selects (CLAUDE.md → "Validation ladder"). Dry runs, about a second.
      - name: verify.sh plan
        run: bash scripts/verify-test.sh
      # scripts/buildkite-verify.sh (`verify.sh remote`) against a fake
      # Buildkite API on loopback (docs/buildkite.md). A few seconds.
      - name: Buildkite client
        run: bash scripts/buildkite-verify-test.sh
      # scripts/release-mobile.sh against a fake gh: the phone's
      # MIN/MAX_HUB_CONTRACT must cover the hub revision it is paired with
      # (fleet-mobile 0.4.8 shipped at 7 beside a revision-8 hub). A second.
      - name: release-mobile contract guard
        run: bash scripts/release-mobile-test.sh
      # The same rule against this tree, so a contract bump meets the phone on
      # its own PR instead of at release time: fleet-mobile main's
      # MIN/MAX_HUB_CONTRACT must cover this checkout's CONTRACT_REVISION.
      # It FAILS only the PR that moves CONTRACT_REVISION (merge the
      # fleet-mobile bump first — a phone that accepts a newer hub is
      # harmless). Every other PR and every push to main only warns, so an
      # unrelated PR is never held hostage by the other repo, and an
      # unreachable GitHub API never fails anything but that bump.
      - name: fleet-mobile accepts this hub contract
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          if bash scripts/check-mobile-contract.sh; then exit 0; fi
          if [ "$EVENT" = pull_request ]; then
            head_rev="$(bash scripts/check-mobile-contract.sh --print-hub-rev)"
            base_rev="$(bash scripts/check-mobile-contract.sh --print-hub-rev --hub-ref "$BASE" || true)"
            if [ "$head_rev" != "$base_rev" ]; then
              echo "::error::this PR moves CONTRACT_REVISION ${base_rev:-?} -> $head_rev, and fleet-mobile main does not accept it (above): merge the fleet-mobile HubContract.kt bump first"
              exit 1
            fi
          fi
          echo "::warning::fleet-mobile main does not accept this tree's hub contract (above); a release would refuse to pair them"
      # Migration numbers: on a PR's merge commit a number main took shows up
      # as two files sharing it; with origin/main fetched, an added file at
      # or below main's highest fails too. The pre-push hook runs the same
      # check earlier. A second.
      - name: Migration numbers
        run: |
          git fetch --quiet --depth=1 origin main:refs/remotes/origin/main || true
          bash scripts/check-migration-numbers-test.sh
          bash scripts/renumber-migrations-test.sh
          scripts/check-migration-numbers.sh

  # tools/ag (the agent launcher) against fake claude/codex binaries. macOS
  # runs it under the stock /bin/bash 3.2 — the whole point of ag's
  # bash-3.2 rules — because the test pins PATH to $FAKE:/usr/bin:/bin.
  ag:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:all-os')) && '["macos-latest","ubuntu-24.04"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: ag launcher tests
        run: bash scripts/ag-test.sh
      - name: shellcheck ag
        if: runner.os == 'Linux'
        run: shellcheck -s bash tools/ag/ag tools/ag/lib/*.sh tools/ag/drivers/*.sh tools/ag/install.sh scripts/ag-test.sh
      # tools/voice/arecord (the host's recorder stand-in for /voice) against
      # fake HTTP / relay servers. Linux only: the test uses coreutils'
      # `timeout` and python3, and hosts that record are Linux boxes.
      - name: voice arecord tests
        if: runner.os == 'Linux'
        run: bash scripts/voice-arecord-test.sh
      - name: shellcheck voice arecord
        if: runner.os == 'Linux'
        run: shellcheck -s bash tools/voice/arecord scripts/voice-arecord-test.sh

  rust:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:all-os')) && '["macos-latest","ubuntu-24.04"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Tauri 2 Linux prerequisites (https://v2.tauri.app/start/prerequisites/)
      # plus the gtk/soup/jsc dev packages its build scripts probe via
      # pkg-config. macOS runners ship everything needed. Keep this list in
      # sync with release.yml.
      - name: Install Tauri Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev pkg-config
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - run: cargo fmt --all --check
      # macOS lints in the `clippy` job below, in parallel with these tests.
      - run: cargo clippy --workspace --all-targets -- -D warnings
        if: runner.os == 'Linux'
      - run: cargo test --workspace
      # cargo-deny checks Cargo.lock, which is platform-independent, so it
      # runs on the Linux leg only. Runs from the repo root, where cargo-deny
      # picks up ./deny.toml on its own; no --config flag because cargo-deny
      # 0.20 moved it from `check` to the root command.
      - uses: taiki-e/install-action@v2
        if: runner.os == 'Linux'
        with:
          tool: cargo-deny
      - run: cargo deny check
        if: runner.os == 'Linux'

  # Windows is a desktop CLIENT for a Linux/macOS fleet (docs/windows.md):
  # the desktop crates must build, lint and test there. fleet-agent,
  # fleet-hub and fleet-updater are Unix-only by design (a systemd service on
  # a fleet host, a Linux daemon, and the update sidecar both of them use),
  # so they are left out; fmt and cargo-deny read nothing
  # platform-specific and stay on the Linux leg of `rust` above.
  rust-windows:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:all-os')) }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # Before checkout: .gitattributes already pins LF, this keeps a runner
      # default from ever turning a generated file or a fixture into CRLF.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: windows
      # Clippy runs in the `clippy` job below, in parallel with these tests.
      # --no-fail-fast: every crate's failures in one run, not only the first
      # failing test binary's.
      - run: cargo test --workspace --exclude fleet-agent --exclude fleet-hub --exclude fleet-updater --no-fail-fast

  # CLIPPY ON macOS AND WINDOWS, BESIDE THEIR TESTS RATHER THAN BEFORE THEM.
  # In one job, clippy's check build ran first and added ~1:45 to the two
  # slowest legs of every run: `rust (macos)` 9:42 and `rust-windows` 7:54 on
  # #437, where the Linux legs took ~6-7 min. Here it lints in parallel, so
  # each OS still gets its own lint pass (cfg(target_os) code) and neither
  # test job waits for it. Linux keeps clippy inside `rust`, which is not
  # the slowest leg. The lint arguments are the ones the test jobs used.
  # Its cache is saved from main only, as windows-bundle's is.
  clippy:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:all-os')) }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --workspace --all-targets
          # fleet-agent, fleet-hub and fleet-updater are Unix-only (see rust-windows).
          - os: windows-latest
            args: --workspace --exclude fleet-agent --exclude fleet-hub --exclude fleet-updater --all-targets
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy ${{ matrix.args }} -- -D warnings

  # The app itself, not only its crates: the frontend bundle, tauri-build's
  # Windows resources (icon.ico, the manifest), the WebView2 link and the
  # NSIS installer the release ships come together only here, so a break in
  # any of them shows on the PR instead of at release time.
  #
  # Its own job, beside rust-windows rather than after its tests: in one job
  # the bundle added ~3 min (Node setup + `tauri build`) to what was already
  # the slowest leg of every run (14:15 on #432, the other legs ~7 min). Here
  # it compiles the app from its own cache in parallel. That cache is saved
  # from main only, so PR runs restore it without adding an entry per PR.
  windows-bundle:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:all-os')) }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: windows-bundle
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Microsoft's ConPTY beside the exe, as the release ships it
      # (scripts/fetch-conpty.sh says why), and proof that it landed there.
      - run: bash scripts/fetch-conpty.sh
        shell: bash
      - run: pnpm tauri build --debug --bundles nsis --config src-tauri/tauri.conpty.conf.json
      - name: ConPTY sits next to the exe
        shell: bash
        run: |
          set -euo pipefail
          for f in claude-fleet.exe conpty.dll OpenConsole.exe licenses/ConPTY-LICENSE.txt; do
            test -s "target/debug/$f" || { echo "::error::target/debug/$f missing"; exit 1; }
          done
          # ...and in the installer itself, which is what users get: files
          # in target/ prove the copy, not the NSIS payload. 7-Zip reads NSIS.
          setup=$(ls target/debug/bundle/nsis/*-setup.exe)
          listing=$(7z l "$setup")
          for f in conpty.dll OpenConsole.exe ConPTY-LICENSE.txt; do
            grep -q "$f" <<<"$listing" || { echo "::error::$f missing from $setup"; exit 1; }
          done

  # The regression guard for the crate split: fleet-hub must build on a box
  # with none of the Tauri system libraries. If this job fails with a
  # gtk/webkit/pkg-config error, a Tauri dependency leaked into fleet-core.
  #
  # fleet-agent rides along for the same reason, one step stricter: it installs
  # on an arbitrary host, so it must build with neither the Tauri libraries nor
  # fleet-core. If it starts pulling either, this is where you find out.
  # fleet-update (the update engine) is held to the same rule: fleet-updater
  # and, later, fleet-agent depend on it.
  hub-headless:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: hub-headless
      - run: cargo build -p fleet-hub --locked
      - run: cargo test -p fleet-core -p fleet-hub --locked
      - run: cargo build -p fleet-agent --locked
      - run: cargo test -p fleet-proto -p fleet-agent -p fleet-update -p fleet-updater --locked
      # The update-publishing scripts (slice S2) end to end: a throwaway
      # minisign key, a fake `gh` and a local bare remote, the real fleet-hub
      # (for `fleet-hub compat`) in a release tarball, and every document
      # checked by fleet-update's own verifier. Nothing leaves the runner.
      - run: sudo apt-get update && sudo apt-get install -y minisign
      - run: cargo build -p fleet-update --bin fleet-release --locked
      - name: Test the update-publishing scripts
        env:
          FLEET_RELEASE: target/debug/fleet-release
          FLEET_HUB: target/debug/fleet-hub
        run: bash scripts/release-update-scripts-test.sh
      # The work-graph leg (hub W, M10.2) needs a hub built with the test-only
      # `e2e` feature (the loopback fake-tracker override). Its own target dir,
      # so the plain target/debug/fleet-hub the rest of the script tests (and
      # whose refusal of that override it asserts) is never replaced. No
      # `cache-directories` above: target/e2e sits inside target/, which
      # rust-cache already saves, and it cleans a nested target dir like the
      # top one. The feature is never default and no release path
      # (release.yml, crates/fleet-hub/Dockerfile) passes --features.
      - run: cargo build -p fleet-hub --features e2e --locked
        env:
          CARGO_TARGET_DIR: target/e2e
      # scripts/hub-e2e.sh drives the binaries just built above as real
      # processes: three hubs, auth (401/403), /healthz, the local-host guard,
      # pairing and /events, SIGTERM shutdown, a fleet-agent dialing a hub
      # over loopback, and hub W's work graph against a fake Jira Cloud
      # (python3) and a fake Claude. With CI=true (set by Actions) the script
      # FAILS rather than skips hub W if WBIN is missing. It needs tmux, jq and
      # python3, which this runner has (ubuntu-24.04 ships all three; the
      # macOS runners in the `rust` job have no tmux, so this step stays on
      # this job only) and builds nothing itself.
      - name: Run hub end-to-end script
        env:
          BIN: target/debug/fleet-hub
          ABIN: target/debug/fleet-agent
          WBIN: target/e2e/debug/fleet-hub
        timeout-minutes: 5
        run: bash scripts/hub-e2e.sh
      # The script's own failure output names which check failed, but the hub
      # and agent logs that say WHY live under its temp root, which dies with
      # the runner. It puts that root in $GITHUB_ENV as HUBE2E_ROOT the moment
      # it creates it, so this collects them however the step ended — a failed
      # check, an early exit, or the 5-minute timeout above.
      - name: Collect hub-e2e logs
        if: failure()
        run: |
          set -u
          root="${HUBE2E_ROOT:-}"
          if [ -z "$root" ] || [ ! -d "$root" ]; then
            echo "no hub-e2e log root to collect (HUBE2E_ROOT='$root')"
            exit 0
          fi
          # Named files only, never the whole root: the data dirs beside them
          # hold each hub's SQLite database, its master token and a generated
          # ssh key, none of which belong in a downloadable artifact.
          mapfile -t files < <(cd "$root" && ls -1 | grep -E '\.(log|sse|err)$')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no logs under $root"
            exit 0
          fi
          tar -czf hub-e2e-logs.tar.gz -C "$root" "${files[@]}"
          ls -la hub-e2e-logs.tar.gz
      - name: Upload hub-e2e logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hub-e2e-logs
          path: hub-e2e-logs.tar.gz
          if-no-files-found: ignore
          retention-days: 7
      # fleet-updater against the runner's Docker daemon (slice S6): a local
      # registry, a good image, one that crashes on start and one that
      # migrates and never gets ready, each ending in the right state, the
      # last with the pre-update backup restored. minisign is installed above.
      - name: Run the updater end-to-end script
        timeout-minutes: 10
        run: bash scripts/updater-e2e.sh

  # THE HUB IMAGE, BUILT BEFORE A TAG NEEDS IT. hub-image.yml builds
  # crates/fleet-hub/Dockerfile only for a pushed v* tag, so a Dockerfile the
  # tree has outgrown failed only after the release was out: v0.4.10 published
  # its desktop bundles and APK with no fleet-hub image at all, because the
  # build context lacked tools/voice (fixed in #450). hub-headless above
  # compiles fleet-hub from the full checkout and cannot see that. This builds
  # the same Dockerfile from the same context, amd64 only, pushes nothing, and
  # runs the image once: `fleet-hub --version` through the real ENTRYPOINT.
  # It reads the release builds' amd64 layer cache and writes none, so a PR
  # never evicts what the next tag build reuses.
  hub-image:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build crates/fleet-hub/Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/fleet-hub/Dockerfile
          platforms: linux/amd64
          build-args: |
            FLEET_GIT_SHA=${{ github.sha }}
            FLEET_BUILD_ID=ci-${{ github.run_id }}
          load: true
          push: false
          tags: fleet-hub:ci
          cache-from: type=gha,scope=linux/amd64
      - name: Run the image
        run: |
          set -euo pipefail
          out="$(docker run --rm fleet-hub:ci --version)"
          echo "$out"
          case "$out" in "fleet-hub "*) ;; *) echo "unexpected --version output"; exit 1 ;; esac
      # The updater's image, for the same reason: hub-image.yml builds it only
      # for a tag.
      - name: Build crates/fleet-updater/Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/fleet-updater/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: fleet-updater:ci
          cache-from: type=gha,scope=updater-linux/amd64
      - name: Run the updater image
        run: |
          set -euo pipefail
          out="$(docker run --rm fleet-updater:ci --version)"
          echo "$out"
          case "$out" in "fleet-updater "*) ;; *) echo "unexpected --version output"; exit 1 ;; esac

  frontend:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:all-os')) && '["macos-latest","ubuntu-24.04","windows-latest"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run test
      - run: pnpm run build
      - run: pnpm audit --audit-level=high
