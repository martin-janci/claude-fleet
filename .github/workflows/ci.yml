name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual re-run. The real coverage is the two triggers above — every PR and
  # every push to main — but without this the workflow cannot be started from
  # the UI or `gh workflow run ci.yml` at all, which is how a job added here
  # gets exercised once against main before anyone relies on it.
  workflow_dispatch:

# ONE LIVE RUN PER REF. Every push to main and every PR push used to start a
# complete run — ten jobs, the macOS, Windows and hub legs among them, around
# 17-19 minutes each warm — and nothing ever cancelled the run a newer commit
# had already superseded. On 2026-10-03 three PRs merged inside 90 seconds, so
# four full runs were alive at once (#425's, plus main at 47787ac, 7dadde8 and
# db1a869) against a runner pool that cannot serve them. Jobs in the newest
# main run sat queued 1-3 minutes before `Set up job`, waiting on two runs
# whose verdict nobody would ever read, and a reviewer watching the PR saw
# spinners that did not move. That is the "CI is stuck" this block fixes.
#
# A PULL REQUEST cancels its own older run: once a new commit exists, the
# previous one's answer is about code that is gone, so it is pure waste.
# `github.ref` is `refs/pull/<n>/merge` here, so the group is per PR and two
# different PRs never cancel each other.
#
# A PUSH TO MAIN does NOT cancel — it queues. Each merge commit keeps its own
# recorded verdict (nothing else re-tests main between releases), and queueing
# is what actually frees the runners: the superseded runs finish one at a time
# instead of three abreast. workflow_dispatch is grouped with the ref it is
# dispatched at and likewise never cancels.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# THE OTHER HALF OF "STUCK" IS `timeout-minutes`, ON EVERY JOB BELOW. Not one
# job declared it, so all of them inherited GitHub's default of SIX HOURS: a
# job that deadlocks rather than fails holds its runner for the rest of the
# morning, and with the pool already full every other run queues behind it —
# the block above cannot help, because a cancelled run frees nothing while the
# hung job is the one still holding the slot. A hang is a real risk in this
# workspace and not a hypothetical one: the test suites are threaded and share
# a process-wide SQLite lock, and the e2e leg starts tmux sessions and daemons.
#
# Each ceiling is roughly 3x the warm, uncontended time measured on main
# (run 37101119677, 2026-10-03) — far enough above a slow cold-cache run to
# never fire on a healthy job, and low enough that a hang costs one job, not
# a morning:
#
#   job                  measured   ceiling
#   version-consistency      0:10        15
#   ag                       0:16        15
#   frontend             2:06-4:39        30
#   rust                16:45-17:33       60
#   rust-windows            18:49         60
#   windows-bundle     (new: the bundle, split out of rust-windows)   60
#   hub-headless            16:39         60
#
# Raise one when the work in it legitimately grows; do not remove it.

jobs:
  # The six version carriers scripts/release.sh rewrites, plus the four
  # Cargo.lock member entries it syncs, must all hold the same string — and
  # crates/fleet-core must stay at its allowlisted 0.1.0 with `publish = false`.
  # Nothing used to check this, so the hand bump to 0.2.27 (fa8f3a30) went
  # unnoticed (F-C5). Seconds, not minutes: text reads plus the runner's
  # preinstalled node — no cargo build, no pnpm install, no cache.
  # release.yml runs the same script as its gating first job, there with
  # --expect-tag, so the pushed tag is checked too.
  version-consistency:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-version-consistency.sh
      # scripts/release-assets.sh is the single source for release.yml's two
      # build matrices, for the tarball names package-linux-release.sh must
      # produce, and for the asset set verify-release.sh demands. Nothing
      # else in CI runs it, so a typo there would first surface at tag time,
      # after the version gate has already passed. This is the cheapest
      # possible smoke test that it still parses, still emits legal matrix
      # JSON, and still declares assets for the version in package.json.
      - name: Smoke-test the release asset manifest
        run: |
          set -euo pipefail
          v="$(node -p 'require("./package.json").version')"
          scripts/release-assets.sh assets "$v"
          for kind in desktop bins; do
            scripts/release-assets.sh matrix "$kind" >"matrix-$kind.json"
            node -e 'const m=require("./"+process.argv[1]);if(!Array.isArray(m.include)||m.include.length===0)throw new Error("empty matrix: "+process.argv[1]);console.log(process.argv[1],"->",m.include.length,"leg(s)")' "matrix-$kind.json"
          done
          for leg in $(scripts/release-assets.sh legs); do
            scripts/release-assets.sh assets "$v" "$leg" >/dev/null
          done
      # A release's notes are CHANGELOG.md's section for its version, lifted
      # verbatim, and release.yml refuses to create a release without one.
      # Catching that at tag time would mean deleting a tag to fix it; catch
      # it on the PR instead. scripts/release.sh always writes the section, so
      # this can only fire on a version that was bumped by hand — which is
      # exactly the mistake that produced the untagged, changelog-less 0.2.27.
      - name: The current version has release notes
        run: |
          set -euo pipefail
          v="$(node -p 'require("./package.json").version')"
          scripts/changelog-section.sh "$v" >/dev/null
          echo "CHANGELOG.md has a section for $v"
      # deploy/hub/backup.sh and upgrade.sh against a fake docker and curl.
      # It ran only from ci-local.sh, so when upgrade.sh started passing
      # --env-file the fake stopped matching and 8 checks failed on main
      # with CI green. bash + sqlite3, a few seconds.
      - name: Hub deploy scripts
        run: |
          command -v sqlite3 >/dev/null || { sudo apt-get update -q && sudo apt-get install -yq sqlite3; }
          bash scripts/hub-deploy-scripts-test.sh

  # tools/ag (the agent launcher) against fake claude/codex binaries. macOS
  # runs it under the stock /bin/bash 3.2 — the whole point of ag's
  # bash-3.2 rules — because the test pins PATH to $FAKE:/usr/bin:/bin.
  ag:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: ag launcher tests
        run: bash scripts/ag-test.sh
      - name: shellcheck ag
        if: runner.os == 'Linux'
        run: shellcheck -s bash tools/ag/ag tools/ag/lib/*.sh tools/ag/drivers/*.sh tools/ag/install.sh scripts/ag-test.sh

  rust:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Tauri 2 Linux prerequisites (https://v2.tauri.app/start/prerequisites/)
      # plus the gtk/soup/jsc dev packages its build scripts probe via
      # pkg-config. macOS runners ship everything needed. Keep this list in
      # sync with release.yml.
      - name: Install Tauri Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev pkg-config
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # cargo-deny checks Cargo.lock, which is platform-independent, so it
      # runs on the Linux leg only. Runs from the repo root, where cargo-deny
      # picks up ./deny.toml on its own; no --config flag because cargo-deny
      # 0.20 moved it from `check` to the root command.
      - uses: taiki-e/install-action@v2
        if: runner.os == 'Linux'
        with:
          tool: cargo-deny
      - run: cargo deny check
        if: runner.os == 'Linux'

  # Windows is a desktop CLIENT for a Linux/macOS fleet (docs/windows.md):
  # the desktop crates must build, lint and test there. fleet-agent and
  # fleet-hub are Unix-only by design (a systemd service on a fleet host, a
  # Linux daemon), so they are left out; fmt and cargo-deny read nothing
  # platform-specific and stay on the Linux leg of `rust` above.
  rust-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # Before checkout: .gitattributes already pins LF, this keeps a runner
      # default from ever turning a generated file or a fixture into CRLF.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: windows
      - run: cargo clippy --workspace --exclude fleet-agent --exclude fleet-hub --all-targets -- -D warnings
      # --no-fail-fast: every crate's failures in one run, not only the first
      # failing test binary's.
      - run: cargo test --workspace --exclude fleet-agent --exclude fleet-hub --no-fail-fast

  # The app itself, not only its crates: the frontend bundle, tauri-build's
  # Windows resources (icon.ico, the manifest), the WebView2 link and the
  # NSIS installer the release ships come together only here, so a break in
  # any of them shows on the PR instead of at release time.
  #
  # Its own job, beside rust-windows rather than after its tests: in one job
  # the bundle added ~3 min (Node setup + `tauri build`) to what was already
  # the slowest leg of every run (14:15 on #432, the other legs ~7 min). Here
  # it compiles the app from its own cache in parallel. That cache is saved
  # from main only, so PR runs restore it without adding an entry per PR.
  windows-bundle:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: windows-bundle
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Microsoft's ConPTY beside the exe, as the release ships it
      # (scripts/fetch-conpty.sh says why), and proof that it landed there.
      - run: bash scripts/fetch-conpty.sh
        shell: bash
      - run: pnpm tauri build --debug --bundles nsis --config src-tauri/tauri.conpty.conf.json
      - name: ConPTY sits next to the exe
        shell: bash
        run: |
          set -euo pipefail
          for f in claude-fleet.exe conpty.dll OpenConsole.exe licenses/ConPTY-LICENSE.txt; do
            test -s "target/debug/$f" || { echo "::error::target/debug/$f missing"; exit 1; }
          done
          # ...and in the installer itself, which is what users get: files
          # in target/ prove the copy, not the NSIS payload. 7-Zip reads NSIS.
          setup=$(ls target/debug/bundle/nsis/*-setup.exe)
          listing=$(7z l "$setup")
          for f in conpty.dll OpenConsole.exe ConPTY-LICENSE.txt; do
            grep -q "$f" <<<"$listing" || { echo "::error::$f missing from $setup"; exit 1; }
          done

  # The regression guard for the crate split: fleet-hub must build on a box
  # with none of the Tauri system libraries. If this job fails with a
  # gtk/webkit/pkg-config error, a Tauri dependency leaked into fleet-core.
  #
  # fleet-agent rides along for the same reason, one step stricter: it installs
  # on an arbitrary host, so it must build with neither the Tauri libraries nor
  # fleet-core. If it starts pulling either, this is where you find out.
  # fleet-update (the update engine) is held to the same rule: fleet-updater
  # and, later, fleet-agent depend on it.
  hub-headless:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: hub-headless
      - run: cargo build -p fleet-hub --locked
      - run: cargo test -p fleet-core -p fleet-hub --locked
      - run: cargo build -p fleet-agent --locked
      - run: cargo test -p fleet-proto -p fleet-agent -p fleet-update --locked
      # The update-publishing scripts (slice S2) end to end: a throwaway
      # minisign key, a fake `gh` and a local bare remote, the real fleet-hub
      # (for `fleet-hub compat`) in a release tarball, and every document
      # checked by fleet-update's own verifier. Nothing leaves the runner.
      - run: sudo apt-get update && sudo apt-get install -y minisign
      - run: cargo build -p fleet-update --bin fleet-release --locked
      - name: Test the update-publishing scripts
        env:
          FLEET_RELEASE: target/debug/fleet-release
          FLEET_HUB: target/debug/fleet-hub
        run: bash scripts/release-update-scripts-test.sh
      # The work-graph leg (hub W, M10.2) needs a hub built with the test-only
      # `e2e` feature (the loopback fake-tracker override). Its own target dir,
      # so the plain target/debug/fleet-hub the rest of the script tests (and
      # whose refusal of that override it asserts) is never replaced. No
      # `cache-directories` above: target/e2e sits inside target/, which
      # rust-cache already saves, and it cleans a nested target dir like the
      # top one. The feature is never default and no release path
      # (release.yml, crates/fleet-hub/Dockerfile) passes --features.
      - run: cargo build -p fleet-hub --features e2e --locked
        env:
          CARGO_TARGET_DIR: target/e2e
      # scripts/hub-e2e.sh drives the binaries just built above as real
      # processes: three hubs, auth (401/403), /healthz, the local-host guard,
      # pairing and /events, SIGTERM shutdown, a fleet-agent dialing a hub
      # over loopback, and hub W's work graph against a fake Jira Cloud
      # (python3) and a fake Claude. With CI=true (set by Actions) the script
      # FAILS rather than skips hub W if WBIN is missing. It needs tmux, jq and
      # python3, which this runner has (ubuntu-24.04 ships all three; the
      # macOS runners in the `rust` job have no tmux, so this step stays on
      # this job only) and builds nothing itself.
      - name: Run hub end-to-end script
        env:
          BIN: target/debug/fleet-hub
          ABIN: target/debug/fleet-agent
          WBIN: target/e2e/debug/fleet-hub
        timeout-minutes: 5
        run: bash scripts/hub-e2e.sh
      # The script's own failure output names which check failed, but the hub
      # and agent logs that say WHY live under its temp root, which dies with
      # the runner. It puts that root in $GITHUB_ENV as HUBE2E_ROOT the moment
      # it creates it, so this collects them however the step ended — a failed
      # check, an early exit, or the 5-minute timeout above.
      - name: Collect hub-e2e logs
        if: failure()
        run: |
          set -u
          root="${HUBE2E_ROOT:-}"
          if [ -z "$root" ] || [ ! -d "$root" ]; then
            echo "no hub-e2e log root to collect (HUBE2E_ROOT='$root')"
            exit 0
          fi
          # Named files only, never the whole root: the data dirs beside them
          # hold each hub's SQLite database, its master token and a generated
          # ssh key, none of which belong in a downloadable artifact.
          mapfile -t files < <(cd "$root" && ls -1 | grep -E '\.(log|sse|err)$')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no logs under $root"
            exit 0
          fi
          tar -czf hub-e2e-logs.tar.gz -C "$root" "${files[@]}"
          ls -la hub-e2e-logs.tar.gz
      - name: Upload hub-e2e logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hub-e2e-logs
          path: hub-e2e-logs.tar.gz
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run test
      - run: pnpm run build
      - run: pnpm audit --audit-level=high
