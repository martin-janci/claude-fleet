name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # Runner-agnostic cargo-deny install (the cargo-deny-action container
      # only runs on Linux). Runs from the repo root, where cargo-deny picks
      # up ./deny.toml on its own; no --config flag because cargo-deny 0.20
      # moved it from `check` to the root command.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny --manifest-path src-tauri/Cargo.toml check
        working-directory: ${{ github.workspace }}

  frontend:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run test
      - run: pnpm run build
      - run: pnpm audit --audit-level=high
