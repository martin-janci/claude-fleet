name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      # Tauri 2 Linux prerequisites (https://v2.tauri.app/start/prerequisites/)
      # plus the gtk/soup/jsc dev packages its build scripts probe via
      # pkg-config. macOS runners ship everything needed. Keep this list in
      # sync with release.yml.
      - name: Install Tauri Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # cargo-deny checks Cargo.lock, which is platform-independent, so it
      # runs on the Linux leg only. Runs from the repo root, where cargo-deny
      # picks up ./deny.toml on its own; no --config flag because cargo-deny
      # 0.20 moved it from `check` to the root command.
      - uses: taiki-e/install-action@v2
        if: runner.os == 'Linux'
        with:
          tool: cargo-deny
      - run: cargo deny --manifest-path src-tauri/Cargo.toml check
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}

  frontend:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run test
      - run: pnpm run build
      - run: pnpm audit --audit-level=high
