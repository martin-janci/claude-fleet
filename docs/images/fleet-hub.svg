<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img">
<style>:root {
  --bg: #f4f6fb; --surface: #ffffff; --surface-2: #eef1f8; --line: #d9deea;
  --fg: #151a28; --muted: #58617a;
  --c-desk: #2563eb; --c-hub: #d97706; --c-host: #0d9488; --c-mob: #db2777; --c-agent: #65a30d; --c-trk: #7c3aed;
  --desk-soft: color-mix(in srgb, var(--c-desk) 11%, var(--surface));
  --hub-soft: color-mix(in srgb, var(--c-hub) 12%, var(--surface));
  --host-soft: color-mix(in srgb, var(--c-host) 11%, var(--surface));
  --mob-soft: color-mix(in srgb, var(--c-mob) 11%, var(--surface));
  --agent-soft: color-mix(in srgb, var(--c-agent) 13%, var(--surface));
  --trk-soft: color-mix(in srgb, var(--c-trk) 11%, var(--surface));
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #0c0f16; --surface: #141925; --surface-2: #1b2130; --line: #2a3345;
  --fg: #e9edf6; --muted: #98a3bb;
  --c-desk: #6aa8ff; --c-hub: #fbbf24; --c-host: #2dd4bf; --c-mob: #f472b6; --c-agent: #a3e635; --c-trk: #a78bfa;
  color-scheme: dark } }
.bg { fill: var(--bg) }
/* SVG styling — every fill comes from the tokens */
text { font-family: var(--f-body); fill: var(--fg) }
.t-title { font: 700 17px var(--f-display) }
.t-big { font: 800 22px var(--f-display) }
.t-sm { font-size: 12.5px; fill: var(--muted) }
.t-mono { font: 500 12px var(--f-mono); fill: var(--muted) }
.t-eye { font: 600 10.5px var(--f-mono); letter-spacing: .12em; fill: var(--muted) }
.t-lbl { font: 600 12px var(--f-mono) }
.fr-desk { fill: var(--desk-soft); stroke: var(--c-desk); stroke-width: 1.6 }
.fr-hub { fill: var(--hub-soft); stroke: var(--c-hub); stroke-width: 1.8 }
.fr-host { fill: var(--host-soft); stroke: var(--c-host); stroke-width: 1.4 }
.fr-mob { fill: var(--mob-soft); stroke: var(--c-mob); stroke-width: 1.6 }
.fr-agent { fill: var(--agent-soft); stroke: var(--c-agent); stroke-width: 1.4 }
.fr-trk { fill: var(--trk-soft); stroke: var(--c-trk); stroke-width: 1.4 }
.box { fill: var(--surface); stroke: var(--line); stroke-width: 1.2 }
.box2 { fill: var(--surface-2); stroke: var(--line); stroke-width: 1 }
.pill { fill: var(--surface); stroke: var(--line) }
.ln-desk { stroke: var(--c-desk); fill: none; stroke-width: 2.2 }
.ln-hub { stroke: var(--c-hub); fill: none; stroke-width: 2.2 }
.ln-host { stroke: var(--c-host); fill: none; stroke-width: 2; stroke-dasharray: 6 5 }
.ln-mob { stroke: var(--c-mob); fill: none; stroke-width: 2.2 }
.ln-agent { stroke: var(--c-agent); fill: none; stroke-width: 2.4 }
.ln-trk { stroke: var(--c-trk); fill: none; stroke-width: 2 }
.ln-dash { stroke-dasharray: 7 6 }
.life { stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 4 5 }
.d-work { fill: var(--c-hub) } .d-idle { fill: var(--muted) } .d-block { fill: var(--c-mob) } .d-ok { fill: var(--c-host) }
.k-desk { fill: var(--c-desk) } .k-hub { fill: var(--c-hub) } .k-host { fill: var(--c-host) } .k-mob { fill: var(--c-mob) } .k-agent { fill: var(--c-agent) } .k-trk { fill: var(--c-trk) }
.tx-desk { fill: var(--c-desk) } .tx-hub { fill: var(--c-hub) } .tx-host { fill: var(--c-host) } .tx-mob { fill: var(--c-mob) } .tx-agent { fill: var(--c-agent) } .tx-trk { fill: var(--c-trk) }

.flow { animation: dash 1.6s linear infinite }
@keyframes dash { to { stroke-dashoffset: -22 } }
@media (prefers-reduced-motion: reduce) { .flow { animation: none } }
</style>
<rect class="bg" x="0" y="0" width="1000" height="640" rx="16"/>
      <title id="b-t">Fleet s hubom</title>
      <desc id="b-d">fleet-hub v strede na serveri. Desktop a mobil sa pripájajú cez HTTPS. Hub ovláda hosty cez SSH, host za NAT sa pripája sám cez fleet-agent. Hore trackery a iný hub.</desc>
      <defs>
        <marker id="bHub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="k-hub"/></marker>
        <marker id="bDesk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="k-desk"/></marker>
        <marker id="bMob" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="k-mob"/></marker>
        <marker id="bAgent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="k-agent"/></marker>
        <marker id="bTrk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="k-trk"/></marker>
        <marker id="bHost" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="k-host"/></marker>
      </defs>

      <!-- top row -->
      <rect x="30" y="18" width="250" height="78" rx="14" class="fr-hub" style="stroke-dasharray:6 5"/>
      <text x="48" y="44" class="t-eye">FEDERÁCIA</text>
      <text x="48" y="66" style="font-weight:600">Iný fleet-hub</text>
      <text x="48" y="84" class="t-mono">správy medzi fleetmi</text>

      <rect x="680" y="18" width="290" height="78" rx="14" class="fr-trk"/>
      <text x="698" y="44" class="t-eye">TRACKERY</text>
      <text x="698" y="66" style="font-weight:600">Jira · GitHub · Linear · Asana</text>
      <text x="698" y="84" class="t-mono">tikety, stav, len čítanie</text>

      <!-- hub -->
      <rect x="300" y="132" width="400" height="244" rx="22" class="fr-hub"/>
      <text x="324" y="160" class="t-eye">VPS / DOMÁCI SERVER · DOCKER</text>
      <text x="324" y="186" class="t-big">fleet-hub</text>
      <text x="680" y="186" text-anchor="end" class="t-mono tx-hub">24/7</text>
      <rect x="324" y="200" width="356" height="32" rx="9" class="box"/>
      <text x="340" y="221" class="t-lbl">Caddy · HTTPS certifikát automaticky</text>
      <g class="t-lbl">
        <rect x="324" y="242" width="64" height="28" rx="7" class="box2"/><text x="356" y="261" text-anchor="middle">/mcp</text>
        <rect x="396" y="242" width="72" height="28" rx="7" class="box2"/><text x="432" y="261" text-anchor="middle">/events</text>
        <rect x="476" y="242" width="62" height="28" rx="7" class="box2"/><text x="507" y="261" text-anchor="middle">/pair</text>
        <rect x="546" y="242" width="66" height="28" rx="7" class="box2"/><text x="579" y="261" text-anchor="middle">/agent</text>
        <rect x="620" y="242" width="60" height="28" rx="7" class="box2"/><text x="650" y="261" text-anchor="middle">/update</text>
      </g>
      <rect x="324" y="282" width="226" height="78" rx="12" class="box"/>
      <text x="340" y="306" style="font-weight:600">fleet-core</text>
      <text x="340" y="326" class="t-sm">reconcile · GC · sync trackerov</text>
      <text x="340" y="344" class="t-sm">orgy · tokeny klientov</text>
      <path d="M566 294 a57 10 0 0 1 114 0 v52 a57 10 0 0 1 -114 0z" class="box"/>
      <ellipse cx="623" cy="294" rx="57" ry="10" class="box2"/>
      <text x="623" y="328" text-anchor="middle" style="font-weight:600">state.db</text>
      <text x="623" y="346" text-anchor="middle" class="t-mono">jediný zdroj</text>

      <!-- desktop -->
      <rect x="22" y="160" width="232" height="176" rx="16" class="fr-desk"/>
      <rect x="40" y="178" width="196" height="100" rx="8" class="box"/>
      <rect x="52" y="192" width="54" height="74" rx="4" class="box2"/>
      <rect x="114" y="192" width="110" height="10" rx="3" class="box2"/>
      <rect x="114" y="208" width="84" height="10" rx="3" class="box2"/>
      <rect x="114" y="226" width="110" height="40" rx="4" style="fill:var(--fg);opacity:.85"/>
      <text x="120" y="242" class="t-mono" style="fill:var(--bg);font-size:10px">$ tmux attach</text>
      <text x="120" y="257" class="t-mono" style="fill:var(--bg);font-size:10px">● claude …</text>
      <text x="40" y="302" style="font-weight:600">Desktop (klient)</text>
      <text x="40" y="322" class="t-sm">okno do fleetu hubu</text>

      <!-- phone -->
      <rect x="800" y="130" width="160" height="262" rx="26" class="fr-mob"/>
      <rect x="814" y="152" width="132" height="200" rx="12" class="box"/>
      <rect x="858" y="138" width="44" height="6" rx="3" class="k-mob" style="opacity:.5"/>
      <text x="826" y="176" style="font-weight:600;font-size:13px">Sessiony</text>
      <rect x="824" y="186" width="112" height="30" rx="8" class="box2"/><circle cx="836" cy="201" r="4.5" class="d-work"/><text x="846" y="205" class="t-mono" style="font-size:10.5px">api-refactor</text>
      <rect x="824" y="222" width="112" height="30" rx="8" class="box2"/><circle cx="836" cy="237" r="4.5" class="d-block"/><text x="846" y="241" class="t-mono" style="font-size:10.5px">train-eval</text>
      <rect x="824" y="258" width="112" height="30" rx="8" class="box2"/><circle cx="836" cy="273" r="4.5" class="d-idle"/><text x="846" y="277" class="t-mono" style="font-size:10.5px">web-fix</text>
      <rect x="824" y="300" width="112" height="40" rx="8" class="k-mob" style="opacity:.16"/>
      <text x="880" y="324" text-anchor="middle" class="t-lbl tx-mob">My work</text>
      <text x="880" y="376" text-anchor="middle" style="font-weight:600;font-size:13px">fleet-mobile</text>

      <!-- hosts -->
      <rect x="30" y="470" width="280" height="140" rx="16" class="fr-host"/>
      <text x="50" y="498" class="t-title">build-01</text><text x="290" y="498" text-anchor="end" class="t-mono">SSH host</text>
      <rect x="50" y="512" width="116" height="28" rx="14" class="pill"/><circle cx="66" cy="526" r="5" class="d-work"/><text x="78" y="531" class="t-lbl">api-refactor</text>
      <rect x="174" y="512" width="116" height="28" rx="14" class="pill"/><circle cx="190" cy="526" r="5" class="d-idle"/><text x="202" y="531" class="t-lbl">docs</text>
      <text x="50" y="566" class="t-sm">hooky → https://hub/…</text>
      <text x="50" y="586" class="t-sm">bez tunelov, priamo na hub</text>

      <rect x="360" y="470" width="280" height="140" rx="16" class="fr-host"/>
      <text x="380" y="498" class="t-title">gpu-box</text><text x="620" y="498" text-anchor="end" class="t-mono">SSH host</text>
      <rect x="380" y="512" width="116" height="28" rx="14" class="pill"/><circle cx="396" cy="526" r="5" class="d-block"/><text x="408" y="531" class="t-lbl">train-eval</text>
      <rect x="504" y="512" width="116" height="28" rx="14" class="pill"/><circle cx="520" cy="526" r="5" class="d-work"/><text x="532" y="531" class="t-lbl">bg · nightly</text>
      <text x="380" y="566" class="t-sm">hub sa pripája cez SSH</text>
      <text x="380" y="586" class="t-sm">svojím vlastným kľúčom</text>

      <rect x="690" y="470" width="280" height="140" rx="16" class="fr-agent"/>
      <text x="710" y="498" class="t-title">laptop-doma</text><text x="950" y="498" text-anchor="end" class="t-mono">za NAT</text>
      <rect x="710" y="512" width="240" height="28" rx="8" class="box"/><text x="722" y="531" class="t-lbl tx-agent">fleet-agent</text><text x="938" y="531" text-anchor="end" class="t-mono">wss://hub/agent</text>
      <text x="710" y="566" class="t-sm">žiadny otvorený port ani tunel,</text>
      <text x="710" y="586" class="t-sm">agent sa k hubu pripojí sám</text>

      <!-- connections -->
      <path d="M254 232 H 296" class="ln-desk" marker-end="url(#bDesk)" marker-start="url(#bDesk)"/>
      <text x="275" y="222" text-anchor="middle" class="t-lbl tx-desk">HTTPS</text>
      <path d="M800 262 H 704" class="ln-mob" marker-end="url(#bMob)" marker-start="url(#bMob)"/>
      <text x="752" y="252" text-anchor="middle" class="t-lbl tx-mob">HTTPS</text>

      <path d="M420 376 C 420 430, 200 420, 190 466" class="ln-hub" marker-end="url(#bHub)"/>
      <path d="M500 376 V 466" class="ln-hub" marker-end="url(#bHub)"/>
      <text x="508" y="424" class="t-lbl tx-hub">SSH</text>
      <path d="M560 470 C 560 440, 560 420, 560 380" class="ln-host flow" marker-end="url(#bHost)"/>
      <text x="568" y="448" class="t-lbl tx-host">hooky</text>
      <path d="M830 466 C 830 420, 700 420, 660 380" class="ln-agent" marker-end="url(#bAgent)"/>
      <text x="848" y="448" class="t-lbl tx-agent">agent vytáča hub</text>

      <path d="M136 336 V 466" class="ln-desk ln-dash" marker-end="url(#bDesk)"/>
      <text x="146" y="398" class="t-lbl tx-desk">terminál priamo</text>
      <text x="146" y="414" class="t-mono">ssh + tmux attach</text>

      <path d="M720 96 C 720 120, 690 118, 680 130" class="ln-trk" marker-end="url(#bTrk)"/>
      <text x="728" y="120" class="t-mono tx-trk">sync</text>
      <path d="M280 72 C 330 72, 350 100, 360 128" class="ln-hub ln-dash" marker-end="url(#bHub)" marker-start="url(#bHub)"/>
    </svg>
