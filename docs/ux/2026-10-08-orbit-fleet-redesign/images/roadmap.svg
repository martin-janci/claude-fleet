<svg xmlns='http://www.w3.org/2000/svg' font-family='-apple-system, Segoe UI, sans-serif' viewBox='0 0 760 768' role='img' style='background:#16191d' aria-label='New becomes the default after M7; new capabilities follow' font-size='13'><defs><marker id='road-arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#8b93a1'/></marker></defs><text data-id='title' x='24' y='30' font-size='15' font-weight='600' fill='#e6e8eb'>New becomes the default after M7; new capabilities follow</text><text data-id='subtitle' x='24' y='50' font-size='11.5' fill='#a3aab5'>Arrows show what each milestone needs first. M0 to M7 move today's functions, M8 to M13 add new ones.</text><g data-anchor='connectors' fill='none' stroke='#8b93a1' stroke-width='1.25'><path d='M364 100H394' marker-end='url(#road-arrow)'/><path d='M194 128V158' marker-end='url(#road-arrow)'/><path d='M194 216V246' marker-end='url(#road-arrow)'/><path d='M136 304V334' marker-end='url(#road-arrow)'/><path d='M380 304V334' marker-end='url(#road-arrow)'/><path d='M624 304V334' marker-end='url(#road-arrow)'/><path d='M136 408V438' marker-end='url(#road-arrow)'/><path d='M380 408V438' marker-end='url(#road-arrow)'/><path d='M624 408V438' marker-end='url(#road-arrow)'/><path d='M107 496V526' marker-end='url(#road-arrow)'/><path d='M289 496V526' marker-end='url(#road-arrow)'/><path d='M471 496V526' marker-end='url(#road-arrow)'/><path d='M653 496V526' marker-end='url(#road-arrow)'/><path d='M107 600V630' marker-end='url(#road-arrow)'/><path d='M562 496V616H653V630' stroke-dasharray='4 4' marker-end='url(#road-arrow)'/></g><g data-anchor='m0'><rect x='24' y='72' width='340' height='56' rx='8' fill='none' fill-opacity='1' stroke='#8b93a1' stroke-width='1.25'/><text data-id='m0-name' x='36' y='96' font-weight='600' fill='#e6e8eb'>M0 Safety net</text><text data-id='m0-body' x='36' y='114' font-size='11.5' fill='#a3aab5'>Shortcut registry, one attention model, tokens</text></g><g data-anchor='m1'><rect x='396' y='72' width='340' height='56' rx='8' fill='none' fill-opacity='1' stroke='#8b93a1' stroke-width='1.25'/><text data-id='m1-name' x='408' y='96' font-weight='600' fill='#e6e8eb'>M1 Quiet the noise</text><text data-id='m1-body' x='408' y='114' font-size='11.5' fill='#a3aab5'>Visible fixes in Classic within a week</text></g><g data-anchor='m2'><rect x='24' y='160' width='340' height='56' rx='8' fill='none' fill-opacity='1' stroke='#8b93a1' stroke-width='1.25'/><text data-id='m2-name' x='36' y='184' font-weight='600' fill='#e6e8eb'>M2 Data model, contract 11</text><text data-id='m2-body' x='36' y='202' font-size='11.5' fill='#a3aab5'>Agent, origin, unread, limit state, phone</text></g><g data-anchor='m3'><rect x='24' y='248' width='712' height='56' rx='8' fill='none' fill-opacity='1' stroke='#8b93a1' stroke-width='1.25'/><text data-id='m3-name' x='36' y='272' font-weight='600' fill='#e6e8eb'>M3 New shell behind Layout: New</text><text data-id='m3-body' x='36' y='290' font-size='11.5' fill='#a3aab5'>Rail, Inbox, one selection, rows, filters panel, keyboard, command palette</text></g><g data-anchor='m4'><rect x='24' y='336' width='224' height='72' rx='8' fill='none' fill-opacity='1' stroke='#8b93a1' stroke-width='1.25'/><text data-id='m4-name' x='36' y='360' font-weight='600' fill='#e6e8eb'>M4 Accounts and hosts</text><text data-id='m4-a' x='36' y='378' font-size='11.5' fill='#a3aab5'>Pills, limits, headroom</text><text data-id='m4-b' x='36' y='394' font-size='11.5' fill='#a3aab5'>Host health, add-host wizard</text></g><g data-anchor='m5'><rect x='268' y='336' width='224' height='72' rx='8' fill='none' fill-opacity='1' stroke='#8b93a1' stroke-width='1.25'/><text data-id='m5-name' x='280' y='360' font-weight='600' fill='#e6e8eb'>M5 Session workspace</text><text data-id='m5-a' x='280' y='378' font-size='11.5' fill='#a3aab5'>Agent tab, terminals 0..N</text><text data-id='m5-b' x='280' y='394' font-size='11.5' fill='#a3aab5'>VS Code, Files, Share</text></g><g data-anchor='m6'><rect x='512' y='336' width='224' height='72' rx='8' fill='none' fill-opacity='1' stroke='#8b93a1' stroke-width='1.25'/><text data-id='m6-name' x='524' y='360' font-weight='600' fill='#e6e8eb'>M6 Work and PRs</text><text data-id='m6-a' x='524' y='378' font-size='11.5' fill='#a3aab5'>Tracker board, filters</text><text data-id='m6-b' x='524' y='394' font-size='11.5' fill='#a3aab5'>Blocked, cost, PR list</text></g><g data-anchor='m7'><rect x='24' y='440' width='712' height='56' rx='8' fill='#5b8def' fill-opacity='0.12' stroke='#5b8def' stroke-width='2'/><text data-id='m7-name' x='36' y='464' font-weight='600' fill='#e6e8eb'>M7 Cutover: New becomes the default</text><text data-id='m7-body' x='36' y='482' font-size='11.5' fill='#e6e8eb'>Settings tree, accessibility, light mode, motion, parity sign-off by Martin</text></g><g data-anchor='m8'><rect x='24' y='528' width='166' height='72' rx='8' fill='none' fill-opacity='1' stroke='#8b93a1' stroke-width='1.25'/><text data-id='m8-name' x='36' y='552' font-weight='600' fill='#e6e8eb'>M8 Automation</text><text data-id='m8-a' x='36' y='570' font-size='11.5' fill='#a3aab5'>Runs, Pause all,</text><text data-id='m8-b' x='36' y='586' font-size='11.5' fill='#a3aab5'>routines</text></g><g data-anchor='m10'><rect x='206' y='528' width='166' height='72' rx='8' fill='none' fill-opacity='1' stroke='#8b93a1' stroke-width='1.25'/><text data-id='m10-name' x='218' y='552' font-weight='600' fill='#e6e8eb'>M10 Conversation</text><text data-id='m10-a' x='218' y='570' font-size='11.5' fill='#a3aab5'>New cards, tour,</text><text data-id='m10-b' x='218' y='586' font-size='11.5' fill='#a3aab5'>empty and offline states</text></g><g data-anchor='m11'><rect x='388' y='528' width='166' height='72' rx='8' fill='none' fill-opacity='1' stroke='#8b93a1' stroke-width='1.25'/><text data-id='m11-name' x='400' y='552' font-weight='600' fill='#e6e8eb'>M11 Organisations</text><text data-id='m11-a' x='400' y='570' font-size='11.5' fill='#a3aab5'>Admin screens,</text><text data-id='m11-b' x='400' y='586' font-size='11.5' fill='#a3aab5'>sharing, federation</text></g><g data-anchor='m12'><rect x='570' y='528' width='166' height='72' rx='8' fill='none' fill-opacity='1' stroke='#8b93a1' stroke-width='1.25'/><text data-id='m12-name' x='582' y='552' font-weight='600' fill='#e6e8eb'>M12 More agents</text><text data-id='m12-a' x='582' y='570' font-size='11.5' fill='#a3aab5'>Codex and Agy</text><text data-id='m12-b' x='582' y='586' font-size='11.5' fill='#a3aab5'>adapters</text></g><g data-anchor='m9'><rect x='24' y='632' width='166' height='72' rx='8' fill='none' fill-opacity='1' stroke='#8b93a1' stroke-width='1.25'/><text data-id='m9-name' x='36' y='656' font-weight='600' fill='#e6e8eb'>M9 Control</text><text data-id='m9-a' x='36' y='674' font-size='11.5' fill='#a3aab5'>Coordinator chat,</text><text data-id='m9-b' x='36' y='690' font-size='11.5' fill='#a3aab5'>views, tasks in chat</text></g><g data-anchor='m13'><rect x='570' y='632' width='166' height='72' rx='8' fill='none' fill-opacity='1' stroke='#8b93a1' stroke-width='1.25'/><text data-id='m13-name' x='582' y='656' font-weight='600' fill='#e6e8eb'>M13 Remove Classic</text><text data-id='m13-a' x='582' y='674' font-size='11.5' fill='#a3aab5'>One release after</text><text data-id='m13-b' x='582' y='690' font-size='11.5' fill='#a3aab5'>the cutover</text></g><text data-id='phone-note' x='24' y='740' font-size='11.5' fill='#a3aab5'>The phone ships with every contract bump: steps 2.7, 4.10, 6.7, 8.9, 9.8, 10.8 and 11.10.</text></svg>