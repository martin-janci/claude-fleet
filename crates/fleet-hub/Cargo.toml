[package]
name = "fleet-hub"
version = "0.2.21"
description = "Headless claude-fleet hub: runs the fleet without the desktop app"
authors = ["martin-janci"]
edition = "2021"
license = "MIT"

[[bin]]
name = "fleet-hub"
path = "src/main.rs"

[dependencies]
fleet-core = { path = "../fleet-core" }
# No `env` feature: every FLEET_HUB_* value is resolved by hand in
# `config::resolve` (flag > env > stored setting > default), which clap's own
# env support cannot express. The env names appear in `--help` as literal text.
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
directories = "5"
serde_json = "1"
# The pairing QR, rendered as Unicode half-blocks straight into the terminal.
# Default features OFF on purpose: they pull `image` and `svg` renderers this
# CLI never uses (and a large transitive tree with them).
qrcode = { version = "0.14", default-features = false }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }

[dev-dependencies]
rcgen = "0.13"
tempfile = "3"
