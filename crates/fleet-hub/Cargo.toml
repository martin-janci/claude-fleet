[package]
name = "fleet-hub"
version = "0.2.18"
description = "Headless claude-fleet hub: runs the fleet without the desktop app"
authors = ["martin-janci"]
edition = "2021"
license = "MIT"

[[bin]]
name = "fleet-hub"
path = "src/main.rs"

[dependencies]
fleet-core = { path = "../fleet-core" }
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
directories = "5"

[dev-dependencies]
tempfile = "3"
