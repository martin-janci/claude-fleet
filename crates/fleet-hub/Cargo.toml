[package]
name = "fleet-hub"
version = "0.6.2-dev.106.desktop.g764356f"
description = "Headless claude-fleet hub: runs the fleet without the desktop app"
authors = ["martin-janci"]
edition = "2021"
license = "MIT"

[[bin]]
name = "fleet-hub"
path = "src/main.rs"

[features]
default = []
# Test-only: the loopback fake-tracker override for `scripts/hub-e2e.sh`'s
# work-graph leg (see fleet-core's `e2e` feature). The CI hub build
# (`cargo build -p fleet-hub --locked`) never enables it.
e2e = ["fleet-core/e2e"]

[dependencies]
# `nl-detect`: the language detector behind `fleet-hub census languages`
# (Jev evaluation D40). Its models add about 45 MB, which is why only the
# hub turns it on.
fleet-core = { path = "../fleet-core", features = ["nl-detect"] }
# Directly, not through `fleet-core`, for one function: the loopback rule the
# bind check applies is the same one the agent and the desktop use
# (`fleet_proto::net`). Already in the tree — `fleet-core` depends on it.
fleet-proto = { path = "../fleet-proto" }
# The update engine's types, for `fleet-hub compat`'s shape (and its test
# against `publish::HubCompat`). In the tree already through fleet-core.
fleet-update = { path = "../fleet-update" }
# The binary target behind `fleet-hub update apply` (a hub run from
# fleet-hub.service without Docker): the same library `fleet-agent update`
# uses. No fleet-core of its own; already in the workspace.
fleet-updater = { path = "../fleet-updater" }
# No `env` feature: every FLEET_HUB_* value is resolved by hand in
# `config::resolve` (flag > env > stored setting > default), which clap's own
# env support cannot express. The env names appear in `--help` as literal text.
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
directories = "5"
serde_json = "1"
# The readiness file `serve` writes and `healthcheck --ready` reads
# (`ready.rs`): already in the tree as `fleet-core`'s dependency.
serde = { version = "1", features = ["derive"] }
# The pairing QR, rendered as Unicode half-blocks straight into the terminal.
# Default features OFF on purpose: they pull `image` and `svg` renderers this
# CLI never uses (and a large transitive tree with them).
qrcode = { version = "0.14", default-features = false }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
# `serve`'s own SIGTERM-cancels-the-ticks token (issue #144), plus naming the
# `CancellationToken` type `start_with_listener` returns in test helpers —
# already in the tree as `fleet-core`'s dependency, not a new crate.
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
# A canned `SshExec` for `decide bench --provider haiku` (`bench.rs` tests):
# already in the tree as `fleet-core`'s dependency, not a new crate.
async-trait = "0.1"
rcgen = "0.13"
tempfile = "3"
# `test-util` only: `#[tokio::test(start_paused = true)]` for the
# `await_ticks` shutdown-ordering tests (issue #144) — same override
# `fleet-core` already carries for the same reason.
tokio = { version = "1", features = ["full", "test-util"] }
