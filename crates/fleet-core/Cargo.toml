[package]
name = "fleet-core"
version = "0.1.0"
# Not versioned in step with the app (scripts/release.sh excludes it) and
# never published: `publish = false` makes that exception enforced instead of
# conventional, so this 0.1.0 can never reach a registry as if it were a
# release of claude-fleet. scripts/check-version-consistency.sh asserts this
# marker is here for every version-exempt crate (F-C22).
publish = false
description = "Transport-agnostic core of claude-fleet: service layer, store, SSH, tmux, MCP control API"
authors = ["martin-janci"]
edition = "2021"
license = "MIT"

[features]
default = []
# Test-only (work graph M10.2): lets `scripts/hub-e2e.sh` point the Jira Cloud
# provider at a loopback fake tracker (`FLEET_E2E_TRACKER_PORT`, see
# `service::trackers::e2e_loopback_port`). Off in every shipped build; even
# with it on, a build without debug assertions (`--release`) refuses the
# override. Never add it to `default`.
e2e = []
# The natural-language detector (`service::nl`, Jev evaluation decisions
# D40/D44): lingua with the six language models the census names — en, sk,
# cs, de, and pl / hu as controls that keep Slovak from being guessed as
# its neighbours. The models add about 45 MB to a binary, so only
# `fleet-hub` turns this on; the desktop bundle never carries them.
nl-detect = ["dep:lingua"]
# Test-only: the few test helpers another crate's tests need
# (`mcp::test_app`, `AgentWsState::with_manual_beats`,
# `AgentRegistry::live_conn`). Only `crates/fleet-agent-e2e` turns it on, as
# a dev-dependency, so no build of a binary ever has it. Never add it to
# `default`.
testkit = []

[dependencies]
sysinfo = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
directories = "5"
regex = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }
dashmap = "6"
async-trait = "0.1"

# The hub/agent wire types, shared with the `fleet-agent` binary (which never
# depends on this crate). See crates/fleet-proto/src/lib.rs.
fleet-proto = { path = "../fleet-proto" }
# The update engine (manifests, signatures, decide()): the hub decides for
# its fleet with the same pure function a standalone client runs. It depends
# on nothing of ours, so this adds no cycle.
fleet-update = { path = "../fleet-update" }

# Control API: the app embeds an MCP server (streamable-HTTP transport) on
# localhost so an AI assistant can drive it. See docs/specs/2026-05-21-control-api-mcp-design.md.
rmcp = { version = "1", features = [
    "server",
    "macros",
    "transport-streamable-http-server",
    "schemars",
] }
# `ws` is for `GET /agent` (crates/fleet-core/src/agent/ws.rs): the WebSocket a
# `fleet-agent` dials in on. It is NOT on by default in axum 0.8. It brings in
# axum's own `tokio-tungstenite`/`tungstenite` rather than a second WebSocket
# stack, plus their `sha1` and `data-encoding` — four packages, all MIT or
# MIT/Apache-2.0.
axum = { version = "0.8", features = ["ws"] }
# `GET /events` builds its SSE body with `stream::unfold`, which is what lets
# one state machine hold the caller's stream permit for the life of the
# connection. `sink` is what `/agent` needs: `StreamExt::split`, so the socket's
# reader and its writer can be separate tasks (a single read-then-write loop
# deadlocks against an agent doing the same when both sides send a large frame
# at once).
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
rand = "0.10"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std", "registry", "tracing-log", "smallvec"] }
tracing-appender = "0.2"

# Outbound HTTPS for tracker providers (work graph M3.0, `net/`): the same
# `tokio-rustls` (ring only) + platform-trust-store pair the desktop already
# used to reach a hub, lifted here, so no second TLS stack and no new crate
# enters `Cargo.lock`. See the M3 plan's Revisions for why not `reqwest`.
# The hub also dials another hub with it (federation, `http_client/`).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-native-certs = "0.8"

# Asset catalog (docs/superpowers/specs/2026-09-14-asset-catalog-design.md)
serde_yaml = "0.9"
sha2 = "0.10"
# The `nl-detect` feature's language detector (see `[features]`).
lingua = { version = "1.8", optional = true, default-features = false, features = [
  "english",
  "slovak",
  "czech",
  "german",
  "polish",
  "hungarian",
] }
# HMAC-SHA256 for the decision record's fingerprints (`service::decide`,
# D37): `decision_runs.input_fp` and status_map section ids.
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
toml = "0.8"
# Asset catalog: `import_host` stages a remote host's dumped `~/.claude`
# under a throwaway directory before importing it (`service/catalog/mod.rs`).
tempfile = "3"

# `run_local_script` (service/add_project.rs) signals a script's whole process
# group (`kill(-pgid, ..)`).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Signed test documents for `service::update`'s tests.
fleet-update = { path = "../fleet-update", features = ["testkit"] }
# `trace` only in tests: the work graph's scale tests (M12.2,
# store/scale_fixture.rs) capture the statements a call runs and check each
# one's query plan. `functions` only in tests: a scalar function that fails
# with SQLITE_IOERR injects a real read-level I/O error
# (`Store::arm_read_ioerr_for_test`). The same crate and version as above; no
# package added.
# `backup` only in tests: every in-memory test store is a page copy of one
# database migrated once per process (`store::migrated_template_copy`).
rusqlite = { version = "0.32", features = ["bundled", "trace", "functions", "backup"] }
# `test-util` only: `#[tokio::test(start_paused = true)]`, so the listener's
# handshake timeout can be tested without the test waiting it out in real time.
tokio = { version = "1", features = ["full", "test-util"] }
# Property tests for shell::quote (see shell.rs). `std` only: no fork/timeout
# runners, which keeps the transitive dev tree small.
proptest = { version = "1", default-features = false, features = ["std"] }
# The CLIENT half of `GET /agent`'s tests: they dial the real endpoint over a
# real loopback socket. It resolves to the SAME tokio-tungstenite 0.29 axum's
# `ws` feature already pulls in for the server half, so it adds no package to
# `Cargo.lock` — keep the two in step when axum moves.
tokio-tungstenite = "0.29"
