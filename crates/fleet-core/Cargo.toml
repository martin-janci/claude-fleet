[package]
name = "fleet-core"
version = "0.1.0"
description = "Transport-agnostic core of claude-fleet: service layer, store, SSH, tmux, MCP control API"
authors = ["martin-janci"]
edition = "2021"
license = "MIT"

[dependencies]
sysinfo = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
directories = "5"
regex = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
dashmap = "6"
async-trait = "0.1"

# Control API: the app embeds an MCP server (streamable-HTTP transport) on
# localhost so an AI assistant can drive it. See docs/specs/2026-05-21-control-api-mcp-design.md.
rmcp = { version = "1", features = [
    "server",
    "macros",
    "transport-streamable-http-server",
    "schemars",
] }
axum = "0.8"
# `GET /events` builds its SSE body with `stream::unfold`, which is what lets
# one state machine hold the caller's stream permit for the life of the
# connection. Default features off: only the `Stream` combinators are used.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rand = "0.10"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std", "registry", "tracing-log", "smallvec"] }
tracing-appender = "0.2"

# Asset catalog (docs/superpowers/specs/2026-09-14-asset-catalog-design.md)
serde_yaml = "0.9"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
toml = "0.8"

# `run_local_script` (service/add_project.rs) signals a script's whole process
# group (`kill(-pgid, ..)`).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# `test-util` only: `#[tokio::test(start_paused = true)]`, so the listener's
# handshake timeout can be tested without the test waiting it out in real time.
tokio = { version = "1", features = ["full", "test-util"] }
# Property tests for shell::quote (see shell.rs). `std` only: no fork/timeout
# runners, which keeps the transitive dev tree small.
proptest = { version = "1", default-features = false, features = ["std"] }
