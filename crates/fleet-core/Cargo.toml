[package]
name = "fleet-core"
version = "0.1.0"
# Not versioned in step with the app (scripts/release.sh excludes it) and
# never published: `publish = false` makes that exception enforced instead of
# conventional, so this 0.1.0 can never reach a registry as if it were a
# release of claude-fleet. scripts/check-version-consistency.sh asserts this
# marker is here for every version-exempt crate (F-C22).
publish = false
description = "Transport-agnostic core of claude-fleet: service layer, store, SSH, tmux, MCP control API"
authors = ["martin-janci"]
edition = "2021"
license = "MIT"

[dependencies]
sysinfo = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
directories = "5"
regex = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
dashmap = "6"
async-trait = "0.1"

# The hub/agent wire types, shared with the `fleet-agent` binary (which never
# depends on this crate). See crates/fleet-proto/src/lib.rs.
fleet-proto = { path = "../fleet-proto" }

# Control API: the app embeds an MCP server (streamable-HTTP transport) on
# localhost so an AI assistant can drive it. See docs/specs/2026-05-21-control-api-mcp-design.md.
rmcp = { version = "1", features = [
    "server",
    "macros",
    "transport-streamable-http-server",
    "schemars",
] }
# `ws` is for `GET /agent` (crates/fleet-core/src/agent/ws.rs): the WebSocket a
# `fleet-agent` dials in on. It is NOT on by default in axum 0.8. It brings in
# axum's own `tokio-tungstenite`/`tungstenite` rather than a second WebSocket
# stack, plus their `sha1` and `data-encoding` — four packages, all MIT or
# MIT/Apache-2.0.
axum = { version = "0.8", features = ["ws"] }
# `GET /events` builds its SSE body with `stream::unfold`, which is what lets
# one state machine hold the caller's stream permit for the life of the
# connection. `sink` is what `/agent` needs: `StreamExt::split`, so the socket's
# reader and its writer can be separate tasks (a single read-then-write loop
# deadlocks against an agent doing the same when both sides send a large frame
# at once).
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
rand = "0.10"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std", "registry", "tracing-log", "smallvec"] }
tracing-appender = "0.2"

# Outbound HTTPS for tracker providers (work graph M3.0, `net/`): the same
# `tokio-rustls` (ring only) + platform-trust-store pair the desktop already
# used to reach a hub, lifted here, so no second TLS stack and no new crate
# enters `Cargo.lock`. See the M3 plan's Revisions for why not `reqwest`.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-native-certs = "0.8"

# Asset catalog (docs/superpowers/specs/2026-09-14-asset-catalog-design.md)
serde_yaml = "0.9"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
toml = "0.8"

# `run_local_script` (service/add_project.rs) signals a script's whole process
# group (`kill(-pgid, ..)`).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# `test-util` only: `#[tokio::test(start_paused = true)]`, so the listener's
# handshake timeout can be tested without the test waiting it out in real time.
tokio = { version = "1", features = ["full", "test-util"] }
# Property tests for shell::quote (see shell.rs). `std` only: no fork/timeout
# runners, which keeps the transitive dev tree small.
proptest = { version = "1", default-features = false, features = ["std"] }
# The CLIENT half of `GET /agent`'s tests: they dial the real endpoint over a
# real loopback socket. It resolves to the SAME tokio-tungstenite 0.29 axum's
# `ws` feature already pulls in for the server half, so it adds no package to
# `Cargo.lock` — keep the two in step when axum moves.
tokio-tungstenite = "0.29"
# The REAL agent, for agent::e2e: the hub and a fleet-agent talking over a
# loopback socket in one process. A dev-dependency only, and in this
# direction only — fleet-agent never depends on fleet-core.
fleet-agent = { path = "../fleet-agent" }
