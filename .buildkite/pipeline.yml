# The persistent builder's pipeline (docs/buildkite.md). Builds are created
# on demand by scripts/buildkite-verify.sh (`scripts/verify.sh remote`), not
# by pushes. One agent, one target dir: concurrency 1, so two builds never
# write the same target/.
steps:
  - label: ":rust: verify full"
    key: verify
    command: scripts/buildkite-step.sh
    agents:
      queue: rust-persistent
    concurrency_group: "claude-fleet/verify"
    concurrency: 1
    # A cold test compile alone takes ~23 min (after a main merge or a
    # toolchain bump); the warm suite ~40. 45 killed build #19 mid-test.
    timeout_in_minutes: 75
