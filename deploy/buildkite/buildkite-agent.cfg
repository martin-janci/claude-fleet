# /etc/buildkite-agent/buildkite-agent.cfg for the persistent builder
# (docs/buildkite.md). The token is the agent token from Buildkite → Agents.
token="REPLACE-WITH-AGENT-TOKEN"
name="fleet-linux-%spawn"
# One agent per target dir: a second spawn would need its own
# CARGO_TARGET_DIR (and ~25 GB more disk).
spawn=1
tags="queue=rust-persistent,os=linux"
build-path="/srv/ci/builds"
hooks-path="/etc/buildkite-agent/hooks"
# The default git clean flags (-ffxdq) are fine: nothing worth keeping lives
# in the checkout.
