# Caddy in front is the default: it obtains and renews the certificate for
# you. The alternative is one container instead of two — drop the `caddy`
# service, publish the hub's own port, and let it terminate TLS with a
# certificate you supply:
#
#   fleet-hub:
#     ports: ["443:443"]
#     environment:
#       FLEET_HUB_BIND: 0.0.0.0
#       FLEET_HUB_PORT: "443"
#       FLEET_HUB_TLS: cert
#       FLEET_HUB_TLS_CERT: /etc/fleet-hub/tls/fullchain.pem
#       FLEET_HUB_TLS_KEY: /etc/fleet-hub/tls/privkey.pem
#     volumes:
#       - ./tls:/etc/fleet-hub/tls:ro
#
# Nothing then renews the pair for you; restart the hub after each renewal.
# The image's HEALTHCHECK (`fleet-hub healthcheck`) inherits this environment,
# and reads FLEET_HUB_PORT and FLEET_HUB_TLS from it — so it probes over TLS
# exactly when the hub serves it. Set them on the service, not only in a
# `command:` override, or the probe speaks the wrong protocol and the
# container reads as permanently unhealthy.
# `FLEET_HUB_TLS=auto` (ACME in the hub itself) is refused — see docs/hub.md.
services:
  fleet-hub:
    image: ghcr.io/martin-janci/fleet-hub:latest
    restart: unless-stopped
    # Worst case a SIGTERM shutdown drains for DRAIN_TIMEOUT (10s) then waits
    # out TICK_SHUTDOWN_TIMEOUT (10s) for an in-flight reconcile/usage pass —
    # give it room before Docker's default 10s grace would SIGKILL it mid-way.
    stop_grace_period: 30s
    env_file: fleet-hub.env
    environment:
      # Reached only by caddy on the compose network; the https:// public URL
      # in fleet-hub.env (Caddy terminates TLS) permits the routable bind.
      FLEET_HUB_BIND: 0.0.0.0
    # The hub's own log file rotates (hourly, 72 kept); Docker's capture of
    # the same lines on stdout does not, and on a small VPS that is the file
    # that fills the disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - hub-data:/var/lib/fleet-hub
      - ./ssh:/home/fleet/.ssh
    # Uncomment and size these from what the hub actually uses on your box
    # (`docker stats`), so a runaway client is throttled by its own cgroup
    # rather than by the host's OOM killer picking a victim. Set too low they
    # turn a transient spike into a restart loop, which `restart:
    # unless-stopped` will happily cycle — so measure first, and leave room.
    # deploy:
    #   resources:
    #     limits:
    #       memory: 1g
    #       cpus: "1.5"
  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file: fleet-hub.env
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
volumes:
  hub-data:
  caddy-data:
