# Caddy in front is the default: it obtains and renews the certificate for
# you. The alternative is one container instead of two — drop the `caddy`
# service, publish the hub's own port, and let it terminate TLS with a
# certificate you supply:
#
#   fleet-hub:
#     ports: ["443:443"]
#     environment:
#       FLEET_HUB_BIND: 0.0.0.0
#       FLEET_HUB_PORT: "443"
#       FLEET_HUB_TLS: cert
#       FLEET_HUB_TLS_CERT: /etc/fleet-hub/tls/fullchain.pem
#       FLEET_HUB_TLS_KEY: /etc/fleet-hub/tls/privkey.pem
#     volumes:
#       - ./tls:/etc/fleet-hub/tls:ro
#
# Nothing then renews the pair for you; restart the hub after each renewal.
# The image's HEALTHCHECK (`fleet-hub healthcheck`) inherits this environment,
# and reads FLEET_HUB_PORT and FLEET_HUB_TLS from it — so it probes over TLS
# exactly when the hub serves it. Set them on the service, not only in a
# `command:` override, or the probe speaks the wrong protocol and the
# container reads as permanently unhealthy.
# `FLEET_HUB_TLS=auto` (ACME in the hub itself) is refused — see docs/hub.md.
services:
  fleet-hub:
    # Pinned to one release on purpose. `docker compose pull` then fetches
    # exactly this version and nothing else, so an upgrade is a line you edit
    # and can revert — see "Upgrade and rollback" in docs/hub.md.
    #
    # The tag has NO `v` prefix: for the git tag `v1.2.3` the image tag the
    # workflow publishes is `1.2.3` (docker/metadata-action's
    # `{{version}}` strips the `v`). `fleet-hub:latest` exists too and is a
    # convenience for "whatever the newest stable release is" — never a
    # deployment you can roll back, since the tag moves under you on every
    # release. A release candidate (`0.3.0-rc.1`) never moves `latest`, and
    # this line is never bumped to one.
    #
    # scripts/release.sh rewrites this line on every stable release, and
    # scripts/check-version-consistency.sh fails CI if it drifts from the rest
    # of the tree. That is an agreement with the TREE, not with the registry:
    # the check compares this tag against package.json and never asks ghcr
    # anything, and the pin is written into the release commit BEFORE
    # hub-image.yml has built or pushed a thing. So between that commit
    # landing on main and both container legs finishing — and permanently, if
    # a leg or the manifest merge fails for that tag — this line can name an
    # image ghcr does not have, and `docker compose pull` says
    # `manifest unknown`.
    #
    # What does check it: scripts/check-release-drift.sh check 5 asks ghcr
    # daily whether this exact pin resolves, and the scheduled
    # release-drift.yml job opens an issue when it does not. If you hit
    # `manifest unknown` on a brand-new install, that is the window — the
    # previous release's tag still works, and the package page lists what
    # actually exists.
    #
    # To pin harder, replace the tag with the immutable digest that release
    # recorded on its GitHub Release page (also printable with
    # `docker buildx imagetools inspect <the image: line below> --format
    # '{{.Manifest.Digest}}'`) — nothing rewrites the version in this comment,
    # so it names no version:
    #
    #   image: ghcr.io/martin-janci/fleet-hub@sha256:<digest>
    #
    # A digest pins one exact multi-arch manifest; a version tag could in
    # principle be re-pushed. Nothing here rewrites a digest for you.
    image: ghcr.io/martin-janci/fleet-hub:0.2.41
    restart: unless-stopped
    # Worst case a SIGTERM shutdown drains for DRAIN_TIMEOUT (10s) then waits
    # out TICK_SHUTDOWN_TIMEOUT (10s) for an in-flight reconcile/usage pass —
    # give it room before Docker's default 10s grace would SIGKILL it mid-way.
    stop_grace_period: 30s
    env_file: fleet-hub.env
    environment:
      # Reached only by caddy on the compose network; the https:// public URL
      # in fleet-hub.env (Caddy terminates TLS) permits the routable bind.
      FLEET_HUB_BIND: 0.0.0.0
    # The hub's own log file rotates (hourly, 72 kept); Docker's capture of
    # the same lines on stdout does not, and on a small VPS that is the file
    # that fills the disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - hub-data:/var/lib/fleet-hub
      - ./ssh:/home/fleet/.ssh
    # Uncomment and size these from what the hub actually uses on your box
    # (`docker stats`), so a runaway client is throttled by its own cgroup
    # rather than by the host's OOM killer picking a victim. Set too low they
    # turn a transient spike into a restart loop, which `restart:
    # unless-stopped` will happily cycle — so measure first, and leave room.
    # deploy:
    #   resources:
    #     limits:
    #       memory: 1g
    #       cpus: "1.5"
  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file: fleet-hub.env
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
volumes:
  hub-data:
  caddy-data:
